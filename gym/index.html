/* CREW tab */

function rangeStart(range) {
  if (range === 'week') return weekStart(today());
  if (range === 'month') return today().slice(0, 7) + '-01';
  return '0000-00-00';
}

function crewStats(start, end) {
  return state.profiles.map((p) => {
    const rows = (state.byUser[p.id] || []).filter((r) => !isWarm(r) && r.date >= start && (!end || r.date <= end));
    return {
      p,
      volume: rows.reduce((s, r) => s + vol(r), 0),
      sets: rows.reduce((s, r) => s + r.sets, 0),
      days: new Set(rows.map((r) => r.date)).size,
      prs: rows.filter((r) => state.prIds.has(r.id)).length
    };
  });
}

function metricText(metric, v) {
  if (metric === 'volume') return fmt(toDisp(v)) + ' ' + unit();
  if (metric === 'sets') return v + ' sets';
  if (metric === 'days') return v + (v === 1 ? ' day' : ' days');
  return v + (v === 1 ? ' PR' : ' PRs');
}

function lbRow(i, p, valText, sub, frac) {
  const c = colorOf(p.id);
  const st = statusOf(p);
  return h('div', { class: 'lb' + (p.id === state.me.id ? ' me' : '') },
    h('div', { class: 'rank r' + (i + 1), text: String(i + 1) }),
    h('div', null,
      h('div', { class: 'lbname' }, avatar(p, 22), p.username,
        st.atGym ? h('em', { text: 'AT GYM' }) : null,
        st.slacking ? h('em', { class: 'slackem', style: 'color:#f87171;border-color:rgba(248,113,113,0.4)', text: 'SLACKING' }) : null),
      h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.max(2, Math.round(frac * 100)) + '%;background:' + c }))
    ),
    h('div', { class: 'lbval' }, valText, sub ? h('small', { text: sub }) : null)
  );
}

function bestE1(pid, k, start, end) {
  let best = null;
  (state.byUser[pid] || []).forEach((r) => {
    if (key(r.exercise) !== k || !qual(r)) return;
    if (start && r.date < start) return;
    if (end && r.date > end) return;
    const e = e1rm(Number(r.weight), r.reps, r.rpe);
    if (!best || e > best.e) best = { e, r };
  });
  return best;
}

function statusPills(p) {
  const st = statusOf(p);
  const out = [];
  if (st.atGym) out.push(h('span', { class: 'pill gym', text: 'AT THE GYM' }));
  if (st.slacking) out.push(h('span', { class: 'pill slack', text: 'SLACKING ' + st.idle + 'D' }));
  else if (st.trainedToday) out.push(h('span', { class: 'pill done', text: 'TRAINED TODAY' }));
  else if (st.kind === 'new') out.push(h('span', { class: 'pill ok', text: 'NO SETS YET' }));
  else {
    const plan = planFor(p.id, today());
    if (hasSchedule(p.id) && !plan.routine) out.push(h('span', { class: 'pill off', text: 'REST DAY' }));
    else out.push(h('span', { class: 'pill ok', text: 'LAST ' + shortDate(st.lastDate).toUpperCase() }));
  }
  return out;
}

function renderCrew() {
  const wrap = h('div', { class: 'fade' });
  wrap.appendChild(h('div', { class: 'eyebrow', text: 'CREW' }));
  wrap.appendChild(h('h1', null, 'The ', h('span', { class: 'accent', text: 'squad' })));

  const meP = myProfile();
  const meSt = statusOf(meP);

  /* who is where */
  const stCard = h('div', { class: 'card' });
  state.profiles.forEach((p) => {
    const plan = planFor(p.id, today());
    stCard.appendChild(h('div', { class: 'lrow' },
      h('div', { class: 'l' },
        h('div', { class: 'lbname' }, avatar(p, 24), p.username),
        plan.routine ? h('small', { text: 'Today: ' + plan.routine.name }) : null
      ),
      h('div', { class: 'r' }, statusPills(p))
    ));
  });
  stCard.appendChild(h('button', {
    class: 'btn ' + (meSt.atGym ? 'ghost' : ''), style: 'margin-top:10px', onclick: toggleAtGym,
    text: meSt.atGym ? 'check out of the gym' : "I'm at the gym"
  }));
  wrap.appendChild(stCard);

  /* tiles */
  const wk = crewStats(weekStart(today()));
  wrap.appendChild(h('div', { class: 'tiles three', style: 'margin-top:12px' },
    h('div', { class: 'tile' }, h('b', { text: String(wk.reduce((s, x) => s + x.days, 0)) }), h('span', { text: 'SESSIONS THIS WEEK' })),
    h('div', { class: 'tile' }, h('b', { text: fmt(toDisp(wk.reduce((s, x) => s + x.volume, 0))) }), h('span', { text: 'VOLUME ' + unit().toUpperCase() })),
    h('div', { class: 'tile' }, h('b', { text: String(wk.reduce((s, x) => s + x.prs, 0)) }), h('span', { text: 'PRS THIS WEEK' }))
  ));

  /* challenges */
  const t = today();
  const ym = t.slice(0, 7);
  const mStart = ym + '-01';
  const mEnd = ym + '-' + String(daysInMonth(ym)).padStart(2, '0');
  wrap.appendChild(h('h2', null, 'Challenges'));
  const chCard = h('div', { class: 'card' });
  const mv = crewStats(mStart, mEnd).sort((a, b) => b.volume - a.volume);
  const mtop = mv.length ? Math.max(mv[0].volume, 1) : 1;
  chCard.appendChild(h('div', { class: 'chal' },
    h('div', { class: 'chalhead' }, h('b', { text: 'Monthly volume' }), h('small', { class: 'muted', text: monthLabel(ym) + ', ' + (daysInMonth(ym) - parseInt(t.slice(8), 10)) + ' days left' })),
    mv.map((x, i) => lbRow(i, x.p, fmt(toDisp(x.volume)) + ' ' + unit(), x.days + ' sessions', x.volume / mtop))
  ));

  const mine = state.challenges.slice().sort((a, b) => (a.end_date < b.end_date ? 1 : -1));
  mine.forEach((c) => {
    const k = key(c.exercise);
    const board = state.profiles.map((p) => ({ p, b: bestE1(p.id, k, c.start_date, c.end_date) }))
      .filter((x) => x.b).sort((a, b) => b.b.e - a.b.e);
    const status = t < c.start_date ? 'starts ' + shortDate(c.start_date) : t > c.end_date ? 'ended ' + shortDate(c.end_date) : daysBetween(t, c.end_date) + ' days left';
    const top = board.length ? board[0].b.e : 1;
    const box = h('div', { class: 'chal' },
      h('div', { class: 'chalhead' },
        h('b', { text: c.name }),
        h('small', { class: 'muted', text: c.exercise + ', ' + status })
      )
    );
    if (!board.length) box.appendChild(h('div', { class: 'muted', text: 'No qualifying sets yet.' }));
    board.forEach((x, i) => box.appendChild(lbRow(i, x.p, fmt(toDisp(x.b.e)) + ' ' + unit(), 'est. 1RM', x.b.e / top)));
    if (c.creator_id === state.me.id) {
      let armed = false;
      const del = h('button', { class: 'btn ghost sm danger', style: 'margin-top:8px', text: 'delete race' });
      del.addEventListener('click', () => {
        if (!armed) { armed = true; del.textContent = 'tap again to delete'; return; }
        deleteChallenge(c.id);
      });
      box.appendChild(del);
    }
    chCard.appendChild(box);
  });
  chCard.appendChild(h('button', { class: 'btn ghost', style: 'margin-top:12px', onclick: openChallengeSheet, text: '+ new lift race' }));
  wrap.appendChild(chCard);

  /* leaderboard */
  wrap.appendChild(h('h2', null, 'Leaderboard'));
  const lbCard = h('div', { class: 'card' });
  lbCard.appendChild(seg([['week', 'this week'], ['month', 'this month'], ['all', 'all time']], state.crewRange, (v) => { state.crewRange = v; render(); }));
  lbCard.appendChild(seg([['volume', 'volume'], ['sets', 'sets'], ['days', 'days'], ['prs', 'PRs']], state.crewMetric, (v) => { state.crewMetric = v; render(); }));
  const M = state.crewMetric;
  const rows = crewStats(rangeStart(state.crewRange)).sort((a, b) => b[M] - a[M]);
  const mx = rows.length ? Math.max(rows[0][M], 1) : 1;
  rows.forEach((x, i) => lbCard.appendChild(lbRow(i, x.p, metricText(M, x[M]), null, x[M] / mx)));
  wrap.appendChild(lbCard);

  /* volume trend */
  const weeks = lastWeeks(8);
  wrap.appendChild(h('h2', null, 'Weekly volume', h('small', { text: unit().toUpperCase() })));
  wrap.appendChild(h('div', { class: 'card' }, chartBox({
    type: 'line',
    data: {
      labels: weeks.map(shortDate),
      datasets: state.profiles.map((p) => lineSet(p.username, weeklyVolume((state.byUser[p.id] || []).filter((r) => !isWarm(r)), weeks), colorOf(p.id), { backgroundColor: 'transparent' }))
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: true, labels: { boxWidth: 8, usePointStyle: true } }, tooltip: TIP },
      scales: axes({ beginAtZero: true })
    }
  }, 220)));

  /* lift board */
  const names = {};
  state.workouts.forEach((r) => {
    if (!qual(r)) return;
    const k = key(r.exercise);
    if (!names[k]) names[k] = { k, name: r.exercise, n: 0 };
    names[k].n += 1;
  });
  const exs = Object.values(names).sort((a, b) => b.n - a.n);
  wrap.appendChild(h('h2', null, 'Lift board', h('small', { text: 'BEST ESTIMATED 1RM' })));
  const lift = h('div', { class: 'card' });
  if (!exs.length) {
    lift.appendChild(h('div', { class: 'muted', text: 'No working sets logged yet.' }));
  } else {
    if (!exs.some((e) => e.k === state.liftKey)) state.liftKey = exs[0].k;
    lift.appendChild(h('select', { class: 'pick', onchange: (e) => { state.liftKey = e.target.value; render(); } },
      exs.map((e) => h('option', { value: e.k, selected: e.k === state.liftKey, text: e.name }))));
    lift.appendChild(seg([['e1rm', 'heaviest'], ['rel', 'per bodyweight']], state.liftSort, (v) => { state.liftSort = v; render(); }));
    const list = state.profiles.map((p) => {
      const b = bestE1(p.id, state.liftKey);
      const bw = state.bwLatest[p.id] ? Number(state.bwLatest[p.id].weight) : null;
      return { p, b, rel: b && bw ? b.e / bw : null };
    }).filter((x) => x.b);
    const sortKey = state.liftSort === 'rel' ? 'rel' : null;
    list.sort((a, b) => (sortKey ? (b.rel || 0) - (a.rel || 0) : b.b.e - a.b.e));
    const topv = list.length ? Math.max(sortKey ? (list[0].rel || 1) : list[0].b.e, 0.0001) : 1;
    list.forEach((x, i) => {
      const val = sortKey ? (x.rel === null ? '-' : x.rel.toFixed(2) + 'x BW') : fmt(toDisp(x.b.e)) + ' ' + unit();
      const sub = sortKey ? fmt(toDisp(x.b.e)) + ' ' + unit() : (x.rel !== null ? x.rel.toFixed(2) + 'x BW' : null);
      const frac = sortKey ? ((x.rel || 0) / topv) : (x.b.e / topv);
      lift.appendChild(lbRow(i, x.p, val, sub, frac));
    });
  }
  wrap.appendChild(lift);

  /* body weights */
  wrap.appendChild(h('h2', null, 'Weigh-ins'));
  const bwCard = h('div', { class: 'card' });
  let anyBw = false;
  state.profiles.forEach((p) => {
    const latest = state.bwLatest[p.id];
    if (!latest) return;
    anyBw = true;
    const cutoff = addDays(today(), -30);
    const older = state.bodyweights.filter((b) => b.profile_id === p.id && b.date <= cutoff).sort(byDate);
    const base = older.length ? older[older.length - 1] : state.bodyweights.filter((b) => b.profile_id === p.id).sort(byDate)[0];
    const diff = base && base.id !== latest.id ? toDisp(latest.weight) - toDisp(base.weight) : null;
    bwCard.appendChild(h('div', { class: 'lrow' },
      h('div', { class: 'l' }, h('div', { class: 'lbname' }, avatar(p, 22), p.username), h('small', { text: shortDate(latest.date) })),
      h('div', { class: 'r' }, dw(latest.weight) + ' ' + unit(), diff !== null ? h('small', { text: signed(diff) + ' vs ' + shortDate(base.date) }) : null)
    ));
  });
  if (!anyBw) bwCard.appendChild(h('div', { class: 'muted', text: 'Nobody has logged a weigh-in yet. Use the Body tab.' }));
  wrap.appendChild(bwCard);

  /* feed */
  wrap.appendChild(h('h2', null, 'Recent PRs', h('small', { text: 'GIVE SOME KUDOS' })));
  const feed = h('div', { class: 'card' });
  const prs = state.workouts.filter((r) => state.prIds.has(r.id)).sort((a, b) => (a.created_at < b.created_at ? 1 : -1)).slice(0, 12);
  if (!prs.length) feed.appendChild(h('div', { class: 'muted', text: 'No PRs yet. Beat your first weight on any lift and it shows up here.' }));
  prs.forEach((r) => {
    const p = state.profiles.find((x) => x.id === r.profile_id);
    if (!p) return;
    const set = state.kudosBy[r.id] || new Set();
    const mineK = set.has(state.me.id);
    const own = r.profile_id === state.me.id;
    feed.appendChild(h('div', { class: 'feed' },
      avatar(p, 24),
      h('div', null,
        h('div', null, h('b', { text: p.username }), ' hit ', h('b', { text: dw(r.weight) + ' ' + unit() + ' x ' + r.reps }), ' on ' + r.exercise),
        h('small', { class: 'muted', text: shortDate(r.date) })
      ),
      h('span', { class: 't', text: ago(r.created_at) }),
      own
        ? (set.size ? h('span', { class: 'kudos', text: '★ ' + set.size }) : null)
        : h('button', { class: 'kudos' + (mineK ? ' on' : ''), onclick: () => toggleKudos(r.id), text: '★ ' + (set.size || 'kudos') })
    ));
  });
  wrap.appendChild(feed);
  return wrap;
}

/* BODY tab */

function renderBody() {
  const wrap = h('div', { class: 'fade' });
  wrap.appendChild(h('div', { class: 'eyebrow', text: 'BODY' }));
  wrap.appendChild(h('h1', null, 'Body ', h('span', { class: 'accent', text: 'weight' })));
  const ws = state.myWeights;
  const latest = ws.length ? ws[ws.length - 1] : null;

  if (!latest) {
    wrap.appendChild(h('div', { class: 'nudge', text: 'No weigh-ins yet. Add one below, then update it every week or so.' }));
  } else if (daysBetween(latest.date, today()) > 7) {
    wrap.appendChild(h('div', { class: 'nudge', text: 'Last weigh-in was ' + daysBetween(latest.date, today()) + ' days ago. Time for a new one.' }));
  }

  if (latest) {
    const cutoff = addDays(today(), -30);
    const older = ws.filter((b) => b.date <= cutoff);
    const base = older.length ? older[older.length - 1] : ws[0];
    const d30 = base.id !== latest.id ? toDisp(latest.weight) - toDisp(base.weight) : null;
    const total = ws.length > 1 ? toDisp(latest.weight) - toDisp(ws[0].weight) : null;
    wrap.appendChild(h('div', { class: 'tiles three' },
      h('div', { class: 'tile' }, h('b', { text: dw(latest.weight) }), h('span', { text: 'NOW, ' + unit().toUpperCase() })),
      h('div', { class: 'tile' }, h('b', { text: d30 === null ? '-' : signed(d30) }), h('span', { text: 'VS ' + (older.length ? '30 DAYS AGO' : 'FIRST') })),
      h('div', { class: 'tile' }, h('b', { text: total === null ? '-' : signed(total) }), h('span', { text: 'TOTAL CHANGE' }))
    ));
  }

  const wIn = h('input', { type: 'number', inputmode: 'decimal', step: 'any', min: '0', placeholder: latest ? dw(latest.weight) : '0' });
  const dIn = h('input', { type: 'date', value: today() });
  const go = () => logWeight(parseFloat(wIn.value), dIn.value || today());
  wIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  wrap.appendChild(h('div', { class: 'card' },
    h('div', { class: 'formrow' },
      h('label', { class: 'fld' }, h('span', { text: unit().toUpperCase() }), wIn),
      h('label', { class: 'fld' }, h('span', { text: 'DATE' }), dIn),
      h('button', { class: 'addbtn', onclick: go, title: 'Save weigh-in', text: '+' })
    )
  ));

  if (ws.length > 1) {
    wrap.appendChild(h('h2', null, 'Trend'));
    wrap.appendChild(h('div', { class: 'card' }, chartBox({
      type: 'line',
      data: { labels: ws.map((b) => shortDate(b.date)), datasets: [lineSet('Body weight', ws.map((b) => Math.round(toDisp(b.weight) * 10) / 10), '#58d9f5', { fill: true })] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: Object.assign({}, TIP, { displayColors: false, callbacks: { label: (c) => c.parsed.y + ' ' + unit() } }) },
        scales: axes()
      }
    }, 200)));
  }

  if (ws.length) {
    wrap.appendChild(h('h2', null, 'History'));
    const hist = h('div', { class: 'card' });
    ws.slice().reverse().slice(0, 20).forEach((b) => {
      let armed = false;
      const del = h('button', { text: '×', title: 'Delete' });
      del.addEventListener('click', () => {
        if (!armed) { armed = true; del.textContent = '?'; return; }
        deleteWeight(b.id);
      });
      hist.appendChild(h('div', { class: 'xrow' }, h('span', { text: longDate(b.date) }), h('b', { text: dw(b.weight) + ' ' + unit() }), del));
    });
    wrap.appendChild(hist);
  }
  return wrap;
}

/* render */

function render() {
  const y = window.scrollY || 0;
  destroyCharts();
  state.pending = [];
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === state.tab));
  const view = $('view');
  if (!state.me) return;
  if (!state.loaded) {
    view.replaceChildren(emptyCard('Loading', 'Pulling your sets...'));
    return;
  }
  if (state.error) {
    const hint = /rpe|set_type|unit|at_gym|routines|schedule|kudos|challenges|exercise_muscles|schema cache|does not exist|bodyweights/i.test(state.error)
      ? 'Looks like setup3.sql has not been run yet. Run it in the Supabase SQL Editor, then retry.'
      : 'Could not reach the database.';
    view.replaceChildren(h('div', { class: 'card errbox' },
      h('p', { text: state.error }),
      h('p', { class: 'muted', text: hint }),
      h('button', { class: 'btn ghost', onclick: () => refreshData(true), text: 'retry' })
    ));
    return;
  }
  const fn = { log: renderLog, plan: renderPlan, progress: renderProgress, crew: renderCrew, body: renderBody }[state.tab] || renderLog;
  view.replaceChildren(fn());
  const jobs = state.pending;
  state.pending = [];
  jobs.forEach((f) => f());
  window.scrollTo(0, y);
  if (state.focusEx) {
    const want = state.focusEx;
    state.focusEx = '';
    const el = Array.from(view.querySelectorAll('input[data-wk]')).find((i) => i.getAttribute('data-wk') === want);
    if (el) {
      try { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
    }
  }
}

function setTab(t) {
  state.tab = t;
  render();
  window.scrollTo(0, 0);
  if (t === 'crew' || t === 'progress' || t === 'plan') refreshData(false);
}

/* auth */

async function sha(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map((x) => x.toString(16).padStart(2, '0')).join('');
}

async function showLogin() {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  const box = $('members');
  box.replaceChildren();
  try {
    const res = await db.from('profiles').select('id, username, created_at').order('created_at');
    if (res.data && res.data.length) {
      state.profiles = res.data;
      const chips = h('div', { class: 'chips' });
      res.data.forEach((p) => {
        chips.appendChild(h('button', { class: 'member', onclick: () => { $('user').value = p.username; $('pin').focus(); } }, avatar(p, 22), p.username));
      });
      box.appendChild(h('div', { class: 'eyebrow', text: 'THE CREW' }));
      box.appendChild(chips);
    }
  } catch (e) { /* offline, skip the member chips */ }
}

async function auth(create) {
  $('loginErr').textContent = '';
  const username = $('user').value.trim().toLowerCase();
  const pin = $('pin').value.trim();
  if (!username || !/^\d{4}$/.test(pin)) { $('loginErr').textContent = 'Enter a username and a 4-digit PIN.'; return; }
  const hash = await sha(username + ':' + pin);
  const found = await db.from('profiles').select('id, username, pin_hash').eq('username', username).maybeSingle();
  if (found.error) { $('loginErr').textContent = found.error.message; return; }
  if (create) {
    if (found.data) { $('loginErr').textContent = 'That username is taken.'; return; }
    const ins = await db.from('profiles').insert({ username, pin_hash: hash }).select('id, username').single();
    if (ins.error) { $('loginErr').textContent = ins.error.message; return; }
    enter(ins.data);
  } else {
    if (!found.data || found.data.pin_hash !== hash) { $('loginErr').textContent = 'Wrong username or PIN.'; return; }
    enter({ id: found.data.id, username: found.data.username });
  }
}

async function enter(profile) {
  state.me = { id: profile.id, username: profile.username };
  lsSet('gym_me', JSON.stringify(state.me));
  state.logDate = today();
  state.tab = 'log';
  state.loaded = false;
  state.error = '';
  state.restOn = lsGet('gym_rest_on') !== '0';
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').replaceChildren(avatar(profile, 20), h('span', { text: profile.username }));
  render();
  await refreshData(true);
}

function logout() {
  lsDel('gym_me');
  state.me = null;
  state.workouts = [];
  state.bodyweights = [];
  state.drafts = {};
  state.extra = [];
  state.rest = null;
  stopRestTimer();
  destroyCharts();
  closeSheet();
  $('pin').value = '';
  showLogin();
}

/* boot */

$('loginBtn').addEventListener('click', () => auth(false));
$('createBtn').addEventListener('click', () => auth(true));
$('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') auth(false); });
$('who').addEventListener('click', openAccount);
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.me) refreshData(false); });

(function boot() {
  let saved = null;
  try { saved = JSON.parse(lsGet('gym_me')); } catch (e) { saved = null; }
  if (saved && saved.id) enter(saved);
  else showLogin();
})();
</script>
