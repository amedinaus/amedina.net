<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }
  body {
    background: #080c10; color: #e6edf3;
    font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.7;
    padding: 0 0 48px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1000;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  }
  nav {
    position: sticky; top: 0; z-index: 100; height: 56px; padding: 0 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(8,12,16,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid #21262d;
  }
  .logo { font-weight: 700; font-size: 13px; color: #39d353; letter-spacing: 0.05em; text-decoration: none; }
  .logo span { color: #8b949e; font-weight: 300; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 1.25rem 0; }
  .label { font-size: 11px; font-weight: 500; letter-spacing: 0.15em; color: #39d353; margin-bottom: 4px; }
  .label::before { content: '// '; color: #484f58; }
  h1 { font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 800; line-height: 1.2; margin-bottom: 20px; letter-spacing: -0.02em; }
  h1 .accent { color: #39d353; }
  h2 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 600; margin: 28px 0 10px; }
  input, button { font-family: inherit; font-size: 12px; padding: 10px 12px; border-radius: 6px; width: 100%; outline: none; }
  input { background: #0d1117; border: 1px solid #21262d; color: #e6edf3; transition: border-color 0.2s; }
  input:focus { border-color: #39d353; }
  input::placeholder { color: #484f58; }
  button { background: #39d353; color: #000; border: 1px solid #39d353; font-weight: 500; letter-spacing: 0.08em; cursor: pointer; transition: all 0.2s; }
  button:hover { background: #4ef570; box-shadow: 0 0 20px rgba(57,211,83,0.25); }
  button.secondary { background: transparent; color: #8b949e; border: 1px solid #30363d; }
  button.secondary:hover { border-color: #39d353; color: #39d353; box-shadow: none; background: transparent; }
  button.small { width: auto; padding: 4px 10px; font-size: 10px; background: transparent; color: #8b949e; border: 1px solid #30363d; }
  button.small:hover { border-color: #39d353; color: #39d353; box-shadow: none; background: transparent; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .gap { margin-bottom: 8px; }
  .card { background: #0d1117; border: 1px solid #21262d; border-radius: 10px; padding: 14px; margin-bottom: 10px; transition: border-color 0.3s; }
  .card:hover { border-color: #196127; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 12px; }
  .item:last-child { border-bottom: none; }
  .muted { color: #8b949e; font-size: 11px; }
  .date { color: #58d9f5; font-size: 11px; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 20px; color: #39d353; font-weight: 500; }
  .stat span { font-size: 10px; letter-spacing: 0.05em; color: #484f58; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .top button { margin-top: 6px; }
  .err { color: #f87171; min-height: 1.2em; font-size: 11px; margin-top: 6px; }
  .hidden { display: none; }
  .pr { color: #e6a817; font-size: 11px; }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">AM<span>.net/gym</span></a>
</nav>

<div class="wrap">

<div id="login">
  <p class="label">GYM LOG</p>
  <h1>Who's <span class="accent">lifting?</span></h1>
  <div class="card">
    <input id="user" placeholder="username" autocapitalize="none" autocomplete="off" class="gap">
    <input id="pin" placeholder="4-digit PIN" inputmode="numeric" maxlength="4" type="password" class="gap">
    <div class="row">
      <button id="loginBtn">log in</button>
      <button id="createBtn" class="secondary">create profile</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div>
      <p class="label">GYM LOG</p>
      <h1 id="hello"></h1>
    </div>
    <button class="small" id="logout">switch user</button>
  </div>

  <div class="card stats">
    <div class="stat"><b id="sSessions">0</b><span>WORKOUT DAYS</span></div>
    <div class="stat"><b id="sWeek">0</b><span>7-DAY VOLUME</span></div>
    <div class="stat"><b id="sSets">0</b><span>TOTAL SETS</span></div>
  </div>

  <h2>Log a set</h2>
  <div class="card">
    <input id="exercise" list="exList" placeholder="exercise (e.g. Bench Press)" class="gap">
    <datalist id="exList"></datalist>
    <div class="row">
      <input id="weight" type="number" inputmode="decimal" placeholder="weight">
      <input id="reps" type="number" inputmode="numeric" placeholder="reps">
      <input id="sets" type="number" inputmode="numeric" placeholder="sets" value="1">
    </div>
    <div class="row">
      <input id="date" type="date">
      <input id="notes" placeholder="notes (optional)">
    </div>
    <button id="addBtn">add set →</button>
    <div class="err" id="addErr"></div>
  </div>

  <h2>Personal records</h2>
  <div class="card" id="prs"></div>

  <h2>History</h2>
  <div id="history"></div>
</div>

</div>

<script>
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
let me = null;

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function sha(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map((x) => x.toString(16).padStart(2, '0')).join('');
}

function saveSession(p) { try { localStorage.setItem('gym_me', JSON.stringify(p)); } catch (e) {} }
function loadSession() { try { return JSON.parse(localStorage.getItem('gym_me')); } catch (e) { return null; } }
function clearSession() { try { localStorage.removeItem('gym_me'); } catch (e) {} }

function today() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

async function auth(create) {
  $('loginErr').textContent = '';
  const username = $('user').value.trim().toLowerCase();
  const pin = $('pin').value.trim();
  if (!username || !/^\d{4}$/.test(pin)) {
    $('loginErr').textContent = 'Enter a username and a 4-digit PIN.';
    return;
  }
  const hash = await sha(username + ':' + pin);
  const { data: found, error } = await db.from('profiles').select('id, username, pin_hash').eq('username', username).maybeSingle();
  if (error) { $('loginErr').textContent = error.message; return; }

  if (create) {
    if (found) { $('loginErr').textContent = 'That username is taken.'; return; }
    const { data, error: e2 } = await db.from('profiles').insert({ username, pin_hash: hash }).select('id, username').single();
    if (e2) { $('loginErr').textContent = e2.message; return; }
    start(data);
  } else {
    if (!found || found.pin_hash !== hash) { $('loginErr').textContent = 'Wrong username or PIN.'; return; }
    start({ id: found.id, username: found.username });
  }
}

function start(profile) {
  me = profile;
  saveSession(profile);
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('hello').textContent = profile.username;
  $('date').value = today();
  refresh();
}

async function refresh() {
  const { data, error } = await db.from('workouts').select('*').eq('profile_id', me.id)
    .order('date', { ascending: false }).order('created_at', { ascending: false });
  if (error) { $('addErr').textContent = error.message; return; }
  render(data || []);
}

function render(rows) {
  const days = new Set(rows.map((r) => r.date));
  const weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 7);
  const weekStr = weekAgo.toISOString().slice(0, 10);
  let weekVol = 0;
  let totalSets = 0;
  const prs = {};
  const names = new Set();

  rows.forEach((r) => {
    const vol = Number(r.weight) * r.reps * r.sets;
    totalSets += r.sets;
    if (r.date >= weekStr) weekVol += vol;
    names.add(r.exercise);
    if (!prs[r.exercise] || Number(r.weight) > prs[r.exercise].weight) {
      prs[r.exercise] = { weight: Number(r.weight), reps: r.reps, date: r.date };
    }
  });

  $('sSessions').textContent = days.size;
  $('sWeek').textContent = Math.round(weekVol).toLocaleString();
  $('sSets').textContent = totalSets;

  const dl = $('exList');
  dl.replaceChildren();
  names.forEach((n) => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });

  const prBox = $('prs');
  prBox.replaceChildren();
  const keys = Object.keys(prs).sort();
  if (!keys.length) prBox.appendChild(el('div', 'nothing logged yet.', 'muted'));
  keys.forEach((k) => {
    const row = el('div', undefined, 'item');
    row.appendChild(el('span', k));
    row.appendChild(el('span', prs[k].weight + ' x ' + prs[k].reps, 'pr'));
    prBox.appendChild(row);
  });

  const hist = $('history');
  hist.replaceChildren();
  const byDate = {};
  rows.forEach((r) => { (byDate[r.date] = byDate[r.date] || []).push(r); });
  Object.keys(byDate).sort().reverse().forEach((d) => {
    const card = el('div', undefined, 'card');
    card.appendChild(el('div', d, 'date'));
    byDate[d].forEach((r) => {
      const row = el('div', undefined, 'item');
      const left = el('div');
      left.appendChild(el('div', r.exercise));
      let line = r.sets + ' x ' + r.reps + ' @ ' + r.weight;
      if (r.notes) line += '  |  ' + r.notes;
      left.appendChild(el('div', line, 'muted'));
      const del = el('button', 'delete', 'small');
      del.addEventListener('click', async () => {
        await db.from('workouts').delete().eq('id', r.id).eq('profile_id', me.id);
        refresh();
      });
      row.appendChild(left);
      row.appendChild(del);
      card.appendChild(row);
    });
    hist.appendChild(card);
  });
}

async function add() {
  $('addErr').textContent = '';
  const exercise = $('exercise').value.trim();
  const weight = parseFloat($('weight').value);
  const reps = parseInt($('reps').value, 10);
  const sets = parseInt($('sets').value, 10) || 1;
  if (!exercise || isNaN(weight) || isNaN(reps)) {
    $('addErr').textContent = 'Need exercise, weight, and reps.';
    return;
  }
  const { error } = await db.from('workouts').insert({
    profile_id: me.id,
    exercise,
    weight,
    reps,
    sets,
    date: $('date').value || today(),
    notes: $('notes').value.trim() || null
  });
  if (error) { $('addErr').textContent = error.message; return; }
  $('reps').value = '';
  $('notes').value = '';
  refresh();
}

$('loginBtn').addEventListener('click', () => auth(false));
$('createBtn').addEventListener('click', () => auth(true));
$('addBtn').addEventListener('click', add);
$('logout').addEventListener('click', () => {
  clearSession();
  me = null;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('pin').value = '';
});

const saved = loadSession();
if (saved && saved.id) start(saved);
</script>
</body>
</html>
