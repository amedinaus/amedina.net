<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080c10">
<title>Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #080c10; color: #e6edf3; min-height: 100vh;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6;
    padding-bottom: calc(140px + env(safe-area-inset-bottom));
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1000;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  }
  button { font-family: inherit; cursor: pointer; color: inherit; background: none; border: none; }
  input, select { font-family: inherit; color: #e6edf3; color-scheme: dark; }
  .hidden { display: none !important; }
  .tap { cursor: pointer; }
  .tap:hover { color: #39d353; }
  .rchip { font-size: 12px; border: 1px solid #30363d; border-radius: 8px; padding: 8px 12px; color: #c9d1d9; }
  .rchip:hover { border-color: #39d353; color: #39d353; }
  .btnstack { display: flex; flex-direction: column; gap: 6px; }
  .goal { padding: 10px 0; border-top: 1px solid #161b22; }
  .goal:first-child { border-top: none; padding-top: 0; }
  .bdgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .bdg { border: 1px solid #21262d; border-radius: 8px; padding: 8px 10px; color: #484f58; }
  .bdg b { display: block; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; }
  .bdg small { display: block; font-size: 9px; margin-top: 2px; }
  .bdg.on { border-color: rgba(230,168,23,0.5); color: #e6a817; background: rgba(230,168,23,0.06); }
  .vsrow { display: grid; grid-template-columns: 1fr 70px 70px; gap: 6px; padding: 8px 0; border-top: 1px solid #161b22; font-size: 12px; align-items: center; }
  .vsrow .c { text-align: right; }
  .vsrow .c.win { color: #39d353; font-weight: 700; }
  .vsrow.head { border-top: none; font-size: 10px; color: #8b949e; letter-spacing: 0.06em; }
  .topright { display: flex; align-items: center; gap: 8px; }
  .chatbtn { position: relative; width: 32px; height: 32px; border: 1px solid #21262d; border-radius: 99px; color: #8b949e; display: flex; align-items: center; justify-content: center; }
  .chatbtn:hover { border-color: #39d353; color: #39d353; }
  .chatbtn svg { width: 16px; height: 16px; }
  .chatbtn i { position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; border-radius: 99px; background: #39d353; color: #000; font-size: 9px; font-style: normal; font-weight: 700; display: none; align-items: center; justify-content: center; padding: 0 3px; }
  .chatbtn i.on { display: flex; }
  .chatpage { position: fixed; inset: 0; z-index: 150; background: #080c10; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }
  .chathead { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #21262d; font-family: 'Syne', sans-serif; font-size: 17px; }
  .chathead .x { font-size: 24px; color: #8b949e; width: 34px; height: 34px; }
  .chatlist { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .composer { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #21262d; background: #0d1117; }
  .daydiv { text-align: center; font-size: 10px; letter-spacing: 0.1em; color: #6e7681; margin: 6px 0 2px; }
  .msg { display: flex; gap: 8px; align-items: flex-end; }
  .msg.me { flex-direction: row-reverse; }
  .mcol { max-width: 78%; min-width: 0; display: flex; flex-direction: column; }
  .msg.me .mcol { align-items: flex-end; }
  .mname { font-size: 10px; color: #8b949e; margin: 0 4px 2px; }
  .mname span { color: #484f58; margin-left: 6px; }
  .bubble { background: #0d1117; border: 1px solid #21262d; border-radius: 14px; padding: 8px 11px; font-size: 13px; line-height: 1.4; cursor: pointer; overflow-wrap: anywhere; text-align: left; }
  .msg.me .bubble { background: rgba(57,211,83,0.1); border-color: #196127; }
  .mtext { white-space: pre-wrap; }
  .cardmsg { min-width: 190px; }
  .cardmsg small { display: block; font-size: 9px; letter-spacing: 0.1em; color: #39d353; }
  .cardmsg b { display: block; font-family: 'Syne', sans-serif; font-size: 14px; margin: 2px 0; }
  .cardmsg .big { font-size: 18px; font-weight: 500; }
  .cardmsg.pr small { color: #e6a817; }
  .cardmsg.pr .big { color: #e6a817; }
  .cmline { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: #c9d1d9; padding: 2px 0; }
  .cmprs { font-size: 10px; color: #e6a817; margin-top: 4px; }
  .rxrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .rx { font-size: 11px; border: 1px solid #30363d; border-radius: 99px; padding: 1px 8px; color: #8b949e; background: #0d1117; }
  .rx.on { border-color: #39d353; color: #39d353; }
  .muted { color: #8b949e; }

  .top {
    position: sticky; top: 0; z-index: 50; height: 54px; padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(8,12,16,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid #21262d;
  }
  .logo { font-weight: 700; font-size: 13px; color: #39d353; letter-spacing: 0.05em; text-decoration: none; }
  .logo span { color: #8b949e; font-weight: 300; }
  .who { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #8b949e; padding: 4px 8px; border-radius: 99px; border: 1px solid #21262d; }
  .who:hover { border-color: #39d353; color: #39d353; }
  .av {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    border-radius: 50%; border: 1px solid; font-weight: 700; font-family: 'Syne', sans-serif;
  }

  .page { max-width: 640px; margin: 0 auto; padding: 22px 16px 0; }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.15em; color: #39d353; margin-bottom: 2px; }
  .eyebrow::before { content: '// '; color: #484f58; }
  h1 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 16px; }
  h1 .accent { color: #39d353; }
  h2 { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; margin: 24px 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h2 small { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 10px; color: #6e7681; letter-spacing: 0.05em; }
  .headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .fade { animation: fadein 0.25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card { background: #0d1117; border: 1px solid #21262d; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .tiles.three { grid-template-columns: repeat(3, 1fr); }
  @media (min-width: 520px) { .tiles.four { grid-template-columns: repeat(4, 1fr); } }
  .tile { background: #0d1117; border: 1px solid #21262d; border-radius: 10px; padding: 12px; }
  .tile b { display: block; font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: #39d353; line-height: 1.25; }
  .tile span { font-size: 10px; letter-spacing: 0.08em; color: #6e7681; }
  .tile small { display: block; font-size: 10px; color: #484f58; }

  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
  .chip { font-size: 11px; color: #8b949e; border: 1px solid #30363d; border-radius: 99px; padding: 7px 14px; }
  .chip:hover { border-color: #39d353; color: #39d353; }
  .chip.on { border-color: #39d353; color: #39d353; background: rgba(57,211,83,0.06); }
  .datepill { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 6px 8px; font-size: 12px; margin-top: 4px; }
  .seg { display: flex; background: #0d1117; border: 1px solid #21262d; border-radius: 9px; padding: 3px; gap: 2px; margin-bottom: 10px; }
  .seg button { flex: 1; font-size: 11px; padding: 9px 4px; border-radius: 6px; color: #8b949e; letter-spacing: 0.04em; }
  .seg button.on { background: #161b22; color: #39d353; }
  select.pick { width: 100%; background: #080c10; border: 1px solid #21262d; border-radius: 8px; padding: 9px 10px; font-size: 12px; margin-bottom: 10px; outline: none; }
  select.pick:focus { border-color: #39d353; }

  .exhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .exname { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.3; }
  .mtag { font-size: 9px; letter-spacing: 0.08em; color: #8b949e; border: 1px solid #30363d; border-radius: 99px; padding: 4px 10px; margin-top: 2px; }
  .mtag:hover { border-color: #39d353; color: #39d353; }
  .prtag { font-size: 10px; color: #e6a817; border: 1px solid rgba(230,168,23,0.35); padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
  .prior { font-size: 11px; color: #6e7681; margin: 4px 0 6px; }
  .hint { background: rgba(88,217,245,0.05); border: 1px solid rgba(88,217,245,0.2); border-radius: 8px; padding: 8px 10px; margin: 6px 0 8px; font-size: 11px; color: #8b949e; line-height: 1.7; }
  .hint b { color: #58d9f5; font-weight: 500; }
  .setrow { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 11px 0; border-top: 1px solid #161b22; cursor: pointer; }
  .setrow:hover .val { color: #39d353; }
  .idx { width: 22px; height: 22px; border-radius: 50%; background: #161b22; color: #8b949e; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .setrow .val { font-size: 14px; font-weight: 500; transition: color 0.2s; }
  .setrow .val u { text-decoration: none; color: #6e7681; font-size: 11px; font-weight: 400; margin-left: 4px; }
  .rpe { color: #e6a817; font-size: 11px; font-weight: 400; margin-left: 6px; }
  .badge { font-size: 9px; letter-spacing: 0.06em; border-radius: 99px; padding: 0 7px; border: 1px solid; margin-left: 6px; font-weight: 400; }
  .badge.warm { color: #58d9f5; border-color: rgba(88,217,245,0.4); }
  .badge.drop { color: #a78bfa; border-color: rgba(167,139,250,0.4); }
  .badge.fail { color: #f87171; border-color: rgba(248,113,113,0.4); }
  .star { color: #e6a817; margin-left: 4px; }
  .e1 { font-size: 10px; color: #6e7681; }
  .setform { display: grid; grid-template-columns: 1fr 1fr 1fr 48px; gap: 8px; margin-top: 10px; align-items: end; }
  .fld span { display: block; font-size: 9px; letter-spacing: 0.1em; color: #6e7681; margin-bottom: 3px; }
  .fld input, .fld select { width: 100%; background: #080c10; border: 1px solid #21262d; border-radius: 8px; padding: 10px 4px; font-size: 16px; font-weight: 500; text-align: center; outline: none; }
  .fld select { text-align-last: center; padding: 10px 2px; font-size: 15px; }
  .fld input:focus, .fld select:focus { border-color: #39d353; }
  .addbtn { height: 44px; border-radius: 8px; background: #39d353; color: #000; font-size: 22px; font-weight: 700; transition: all 0.2s; }
  .addbtn:hover { background: #4ef570; box-shadow: 0 0 18px rgba(57,211,83,0.3); }
  .typebar { display: flex; gap: 4px; margin-top: 8px; }
  .morebtn { display: block; width: 100%; text-align: center; margin-top: 10px; font-size: 11px; letter-spacing: 0.06em; color: #8b949e; border: 1px solid #21262d; border-radius: 8px; padding: 9px 0; }
  .morebtn:hover { border-color: #39d353; color: #39d353; }
  .morepanel { margin-top: 6px; }
  .typebar button { flex: 1; font-size: 11px; padding: 10px 0; border: 1px solid #21262d; border-radius: 6px; color: #8b949e; }
  .typebar button.on { border-color: #39d353; color: #39d353; background: rgba(57,211,83,0.06); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .exnote { font-size: 11px; color: #e6a817; margin-bottom: 8px; cursor: pointer; }
  .sstag { font-size: 9px; letter-spacing: 0.08em; color: #58d9f5; border: 1px solid rgba(88,217,245,0.3); border-radius: 99px; padding: 0 8px; margin-left: 6px; }
  textarea.field { resize: vertical; font-family: inherit; }
  .tools button { font-size: 11px; color: #8b949e; border: 1px solid #21262d; border-radius: 8px; padding: 10px 14px; }
  .tools button:hover { border-color: #39d353; color: #39d353; }
  .addex { width: 100%; padding: 15px; border: 1px dashed #30363d; border-radius: 12px; color: #8b949e; font-size: 12px; letter-spacing: 0.08em; transition: all 0.2s; }
  .addex:hover { border-color: #39d353; color: #39d353; background: rgba(57,211,83,0.04); }
  .banner { border: 1px solid #196127; background: rgba(57,211,83,0.06); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .banner b { font-family: 'Syne', sans-serif; font-size: 15px; display: block; }
  .banner small { font-size: 10px; color: #6e7681; letter-spacing: 0.05em; }
  .btn.sm { width: auto; padding: 8px 14px; font-size: 11px; }

  .chartbox { position: relative; width: 100%; }
  .minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #161b22; }
  .minis b { display: block; font-size: 15px; font-weight: 500; }
  .minis span { font-size: 9px; letter-spacing: 0.08em; color: #6e7681; }
  .heat { display: grid; grid-auto-flow: column; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(7, auto); gap: 3px; }
  .heat i { display: block; aspect-ratio: 1; border-radius: 3px; background: #161b22; }
  .heat i.l1 { background: #0e4429; }
  .heat i.l2 { background: #006d32; }
  .heat i.l3 { background: #26a641; }
  .heat i.l4 { background: #39d353; }
  .heat i.fut { opacity: 0.25; }
  .legend { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 8px; font-size: 10px; color: #6e7681; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: block; background: #161b22; }

  .lrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid #161b22; }
  .lrow:first-child { border-top: none; }
  .lrow .l { min-width: 0; }
  .lrow .l div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .r { text-align: right; flex-shrink: 0; font-weight: 500; }
  .lrow small { display: block; font-size: 10px; color: #6e7681; font-weight: 400; }
  .lbname { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
  .lbname em { font-style: normal; font-size: 9px; letter-spacing: 0.08em; color: #39d353; border: 1px solid #196127; border-radius: 99px; padding: 0 6px; }
  .lb { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 10px 8px; border-top: 1px solid #161b22; border-radius: 8px; }
  .lb:first-of-type { border-top: none; }
  .lb.me { background: rgba(57,211,83,0.06); }
  .rank { width: 24px; height: 24px; border-radius: 50%; background: #161b22; color: #8b949e; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .rank.r1 { background: rgba(230,168,23,0.18); color: #e6a817; }
  .rank.r2 { background: rgba(192,200,208,0.15); color: #c0c8d0; }
  .rank.r3 { background: rgba(205,127,50,0.18); color: #cd7f32; }
  .bar { height: 4px; background: #161b22; border-radius: 99px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; transition: width 0.5s ease; }
  .lbval { text-align: right; font-weight: 500; font-size: 14px; }
  .lbval small { display: block; font-size: 9px; color: #6e7681; font-weight: 400; letter-spacing: 0.06em; }
  .feed { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid #161b22; font-size: 12px; }
  .feed:first-child { border-top: none; }
  .feed .t { margin-left: auto; font-size: 10px; color: #484f58; flex-shrink: 0; }
  .kudos { font-size: 11px; border: 1px solid #30363d; border-radius: 99px; padding: 0 10px; color: #8b949e; flex-shrink: 0; }
  .kudos.on { border-color: #e6a817; color: #e6a817; }
  .pill { font-size: 9px; letter-spacing: 0.06em; border-radius: 99px; padding: 0 8px; border: 1px solid; white-space: nowrap; }
  .pill.gym { color: #39d353; border-color: #196127; background: rgba(57,211,83,0.08); }
  .pill.slack { color: #f87171; border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.08); }
  .pill.ok { color: #8b949e; border-color: #30363d; }
  .pill.off { color: #58d9f5; border-color: rgba(88,217,245,0.3); }
  .pill.done { color: #39d353; border-color: #196127; }
  .chal { border-top: 1px solid #161b22; padding-top: 12px; margin-top: 12px; }
  .chal:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .chalhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .chalhead b { font-family: 'Syne', sans-serif; font-size: 14px; }

  .whochips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .wchip { display: flex; align-items: center; gap: 6px; font-size: 11px; border: 1px solid #21262d; border-radius: 99px; padding: 3px 10px 3px 4px; color: #8b949e; }
  .wchip.all { padding: 3px 12px; }
  .wchip.on { border-color: #39d353; color: #39d353; }
  .monthnav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; }
  .monthnav button { width: 36px; height: 36px; border: 1px solid #21262d; border-radius: 8px; color: #8b949e; font-size: 16px; }
  .monthnav button:hover { border-color: #39d353; color: #39d353; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .wh { text-align: center; font-size: 9px; letter-spacing: 0.08em; color: #6e7681; padding: 2px 0; }
  .day { aspect-ratio: 1 / 1.05; background: #0d1117; border: 1px solid #161b22; border-radius: 8px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; font-size: 10px; color: #8b949e; text-align: left; min-width: 0; overflow: hidden; }
  .day:hover { border-color: #30363d; }
  .day.out { visibility: hidden; }
  .day.today { border-color: #39d353; color: #39d353; }
  .day.fut { color: #6e7681; }
  .day.multi { aspect-ratio: auto; min-height: 64px; justify-content: flex-start; gap: 2px; }
  .pline { font-size: 8px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .pline i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid; margin-right: 3px; vertical-align: middle; box-sizing: border-box; }
  .wgrid { display: grid; grid-template-columns: 58px repeat(7, minmax(0, 1fr)); gap: 3px; align-items: stretch; }
  .wgrid .wh { text-align: center; font-size: 9px; letter-spacing: 0.06em; color: #6e7681; padding: 2px 0; }
  .wgrid .wh.today { color: #39d353; }
  .wgrid .who { display: flex; align-items: center; gap: 4px; font-size: 10px; padding: 0; border: none; border-radius: 0; min-width: 0; overflow: hidden; }
  .wgrid .who span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wcell { min-height: 30px; border: 1px solid #161b22; background: #0d1117; border-radius: 6px; font-size: 9px; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; padding: 0 1px; color: #484f58; }
  .wcell.today { border-color: #39d353; }
  .wcell.plan { border-style: dashed; }
  .dots { display: flex; flex-wrap: wrap; gap: 2px; width: 100%; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; display: block; border: 1.5px solid transparent; }
  .dots i.ring { background: transparent; }

    fetchAll('exercise_settings', 'profile_id, key, note, rep_min, rep_max, jump', (q) => q.order('profile_id').order('key')).catch(() => []),

    fetchAll('goals', 'id, profile_id, exercise, target, reps, deadline, created_at', (q) => q.order('created_at').order('id')).catch(() => [])
  ]);
  state.profiles = r[0];

function normSet(w) {
  return Object.assign({}, w, {
    set_type: w.set_type || 'working',

  });
}

function derive() {
  const me = state.me.id;
  const mp = state.profiles.find((p) => p.id === me);
  state.unit = mp && mp.unit === 'kg' ? 'kg' : 'lb';
  state.mine = state.workouts.filter((w) => w.profile_id === me);
  state.byUser = {};
  state.profiles.forEach((p) => { state.byUser[p.id] = []; });
  state.workouts.forEach((w) => { (state.byUser[w.profile_id] = state.byUser[w.profile_id] || []).push(w); });
  state.prIds = new Set();
  for (const pid in state.byUser) {
    const best = {};
    state.byUser[pid].slice().sort(byTime).forEach((r) => {
      if (isWarm(r)) return;
      const k = key(r.exercise);
      const w = Number(r.weight);
      if (k in best) {
        if (w > best[k] + 0.0005) { state.prIds.add(r.id); best[k] = w; }
      } else {
        best[k] = w;
      }
    });
  }
  state.myWeights = state.bodyweights.filter((b) => b.profile_id === me).sort(byDate);
  state.bwLatest = {};
  state.bodyweights.slice().sort(byDate).forEach((b) => { state.bwLatest[b.profile_id] = b; });
  state.routineById = {};
  state.routines.forEach((r) => { state.routineById[r.id] = r; });
  state.kudosBy = {};
  state.kudos.forEach((k) => { (state.kudosBy[k.workout_id] = state.kudosBy[k.workout_id] || new Set()).add(k.from_profile); });
  state.schMap = {};
  state.schedule.forEach((s) => { state.schMap[s.profile_id + '|' + s.weekday] = s; });
  state.actByUser = {};
  state.activities.forEach((a) => { (state.actByUser[a.profile_id] = state.actByUser[a.profile_id] || []).push(a); });
  state.exMap = {};
  state.exSettings.forEach((x) => { if (x.profile_id === me) state.exMap[x.key] = x; });
  state.setMap = {};
  state.settings.forEach((s) => { state.setMap[s.profile_id] = s; });
  state.ovMap = {};
  state.overrides.forEach((o) => { state.ovMap[o.profile_id + '|' + o.date] = o; });
}

function myProfile() { return state.profiles.find((p) => p.id === state.me.id) || state.me; }

function myExercises() {
  const c = {};
  state.mine.forEach((r) => {
    const k = key(r.exercise);
    if (!c[k]) c[k] = { k, name: r.exercise, n: 0 };
    c[k].n += 1;
  });
  return Object.values(c).sort((a, b) => b.n - a.n);
}

function lastSession(k, before) {
  const rows = state.mine.filter((r) => key(r.exercise) === k && r.date < before && !isWarm(r));
  if (!rows.length) return null;
  const d = rows.reduce((m, r) => (r.date > m ? r.date : m), '');
  return { date: d, rows: rows.filter((r) => r.date === d).sort(byTime) };
}

function bestWeight(k) {
  let b = null;
  state.mine.forEach((r) => {
    if (key(r.exercise) !== k || isWarm(r)) return;
    const w = Number(r.weight);
    if (b === null || w > b) b = w;
  });
  return b;
}

function topSet(rows) {
  return rows.reduce((m, r) => {
    const w = Number(r.weight);
    const mw = Number(m.weight);
    return (w > mw + 0.0005 || (Math.abs(w - mw) <= 0.0005 && r.reps > m.reps)) ? r : m;
  }, rows[0]);
}

/* best recent estimated 1RM from real working sets of 1 to 10 reps */
function est1RM(k) {
  const cutoff = addDays(today(), -90);
  let best = null;
  state.mine.forEach((r) => {
    if (key(r.exercise) !== k || !qual(r) || r.date < cutoff) return;
    const e = e1rm(Number(r.weight), r.reps, r.rpe);
    if (!best || e > best.e) best = { e, r };
  });
  return best;
}

/* simple progression: RPE decides between more weight, one more rep, or repeat */
function suggestion(k, name, before) {
  const prior = lastSession(k, before);
  if (!prior) return null;
  const top = topSet(prior.rows);
  const comp = isCompound(name);
  const pref = state.exMap[k];
  const inc = pref && Number(pref.jump) > 0 ? toDisp(pref.jump) : (state.unit === 'kg' ? (comp ? 2.5 : 1) : (comp ? 5 : 2.5));
  const w = toDisp(top.weight);
  const rpe = top.rpe;
  let nw = w;
  let nr = top.reps;
  let why;
  if (pref && pref.rep_min && pref.rep_max) {
    const lo = pref.rep_min;
    const hi = pref.rep_max;
    if (rpe != null && rpe >= 10) {
      why = 'RPE 10 last time, match it before progressing';
    } else if (top.reps >= hi) {
      nw = w + inc;
      nr = lo;
      why = 'hit the top of your ' + lo + ' to ' + hi + ' range, add weight';
    } else if (top.reps < lo) {
      nr = lo;
      why = 'below your ' + lo + ' to ' + hi + ' range, work up to ' + lo;
    } else {
      nr = top.reps + 1;
      why = 'inside your ' + lo + ' to ' + hi + ' range, add a rep';
    }
  } else if (rpe != null) {
    if (rpe <= 8) {
      nw = w + inc;
      why = 'last top set was RPE ' + rpe + ', room to add weight';
    } else if (rpe <= 9.5) {
      if (top.reps >= 12) { nw = w + inc; nr = 8; why = 'hit 12 reps near the limit, go heavier'; }
      else { nr = top.reps + 1; why = 'close to the limit, add a rep first'; }
    } else {
      why = 'RPE 10 last time, match it before adding';
    }
  } else if (top.reps >= 10) {
    nw = w + inc;
    nr = 8;
    why = 'you hit 10+ reps, time to go up';
  } else {
    nr = top.reps + 1;
    why = 'add a rep, then add weight';
  }
  return { w: Math.round(nw * 10) / 10, r: nr, why, from: top };
}

/* streaks: a streak is the number of training days in a chain, broken by 3 days with no workout */
const STREAK_BREAK = 3;
function streakOf(pid) {
  const ds = trainDays(pid);
  if (!ds.length) return { cur: 0, best: 0 };
  let run = 0;
  let best = 0;
  let prev = null;
  ds.forEach((d) => {
    if (prev && daysBetween(prev, d) - 1 >= STREAK_BREAK) run = 0;
    run += 1;
    if (run > best) best = run;
    prev = d;
  });
  const idle = daysBetween(prev, today()) - 1;
  return { cur: idle >= STREAK_BREAK ? 0 : run, best };
}

/* plan, schedule, status */

function settingsOf(pid) { return state.setMap[pid] || null; }
function scheduleMode(pid) { const s = settingsOf(pid); return s && s.mode === 'rotation' ? 'rotation' : 'weekly'; }
function hasSchedule(pid) {
  if (scheduleMode(pid) === 'rotation') return settingsOf(pid).cycle.length > 0;
  return state.schedule.some((s) => s.profile_id === pid);
}

/* Rotation: the cycle only moves forward when you train. Rest slots use up a calendar day,
   routine slots wait for you (a missed day just pushes the split back). */
function rotationPos(pid, t) {
  const s = settingsOf(pid);
  if (!s || s.mode !== 'rotation' || !s.cycle.length) return null;
  const n = s.cycle.length;
  let p = (((s.pos || 0) % n) + n) % n;
  let d = s.pos_date || t;
  let guard = 0;
  while (d < t && s.cycle[p] == null && guard < n) { p = (p + 1) % n; d = addDays(d, 1); guard += 1; }
  if (d < t) d = t;
  return { p, d, n, cycle: s.cycle };
}

function planFor(pid, date) {
  const ov = state.ovMap[pid + '|' + date];
  if (ov) return { routine: ov.routine_id ? (state.routineById[ov.routine_id] || null) : null, source: 'override' };
  if (scheduleMode(pid) === 'rotation') {
    const t = today();
    const r = date < t ? null : rotationPos(pid, t);
    if (!r) return { routine: null, source: 'none' };
    const idx = ((((r.p + daysBetween(r.d, date)) % r.n) + r.n) % r.n);
    const id = r.cycle[idx];
    return { routine: id ? (state.routineById[id] || null) : null, source: 'rotation' };
  }
  const s = state.schMap[pid + '|' + weekdayIdx(date)];
  if (s && s.routine_id) return { routine: state.routineById[s.routine_id] || null, source: 'weekly' };
  return { routine: null, source: s ? 'weekly' : 'none' };
}

function statusOf(p) {
  const days = trainDays(p.id);
  const t = today();
  const atGym = !!(p.at_gym_until && new Date(p.at_gym_until).getTime() > Date.now());
  if (!days.length) return { kind: 'new', atGym, slacking: false, idle: 0, lastDate: null, trainedToday: false };
  const last = days[days.length - 1];
  const trainedToday = days.indexOf(t) >= 0;
  let idle = Math.max(0, daysBetween(last, t) - 1);
  if (scheduleMode(p.id) === 'weekly' && hasSchedule(p.id) && idle > 0) {
    for (let d = addDays(last, 1); d < t; d = addDays(d, 1)) {
      if (!planFor(p.id, d).routine) idle -= 1;
    }
  }
  idle = Math.max(0, idle);
  const slacking = !trainedToday && idle >= 3;
  return { kind: slacking ? 'slack' : 'ok', atGym, slacking, idle, lastDate: last, trainedToday };
}

/* actions */

async function logSet(name, wDisp, reps, rpe, type) {
  if (!Number.isFinite(wDisp) || wDisp < 0 || !Number.isFinite(reps) || reps < 1) { toast('Enter weight and reps', 'err'); return; }
  const k = key(name);
  const w = fromDisp(wDisp);
  const prev = bestWeight(k);
  const res = await db.from('workouts').insert({
    profile_id: state.me.id, exercise: name, weight: w, reps, sets: 1, date: state.logDate, rpe, set_type: type
  }).select().single();
  if (res.error) { toast(res.error.message, 'err'); return; }
  state.workouts.push(normSet(res.data));
  derive();
  state.drafts[state.logDate + '|' + k] = { w: String(wDisp), r: String(reps), rpe: rpe == null ? '' : String(rpe), type };
  if (type !== 'warmup' && prev !== null && w > prev + 0.0005) toast('NEW PR: ' + name + ' ' + fmtW(wDisp) + ' ' + unit(), 'pr');
  let pr = false;
  if (type !== 'warmup' && prev !== null && w > prev + 0.0005) pr = true;
  const partner = type !== 'warmup' ? ssPartner(state.logDate, k) : null;
  let skipRest = false;
  if (partner) {
    const cnt = (kk) => state.mine.filter((x) => x.date === state.logDate && key(x.exercise) === kk && !isWarm(x)).length;
    if (cnt(k) > cnt(partner)) {
      skipRest = true;
      state.focusEx = partner;
      if (!pr) toast('Superset: now ' + (sessionOrder(state.logDate).find((o) => o.k === partner) || { name: 'your partner lift' }).name);
    }
  }
  if (pr) autoPostPR(name, w, reps);
  if (type !== 'warmup' && state.restOn && !skipRest) startRest();
  render();
}

/* training a routine from a rotating split moves the split past it */
async function advanceRotation(rid) {
  const st = settingsOf(state.me.id);
  if (!st || st.mode !== 'rotation' || !st.cycle.length) return;
  const t = today();
  const r = rotationPos(state.me.id, t);
  if (r.d > t && st.cycle[(r.p - 1 + r.n) % r.n] === rid) return;
  let idx = -1;
  for (let i = 0; i < r.n; i += 1) {
    const j = (r.p + i) % r.n;
    if (st.cycle[j] === rid) { idx = j; break; }
  }
  if (idx < 0) return;
  await saveSettings({ pos: (idx + 1) % r.n, pos_date: addDays(t, 1) });
}

/* "push, pull, legs, rest" -> cycle of routine ids and nulls */
function parseSplit(text, routines) {
  const raw = text.indexOf(',') >= 0 ? text.split(',') : text.trim().split(/\s+/);
  const out = [];
  for (let i = 0; i < raw.length; i += 1) {
    const w = raw[i].trim().toLowerCase();
    if (!w) continue;
    if (['r', 'rest', 'off', 'x', '-'].indexOf(w) >= 0) { out.push(null); continue; }
    let m = routines.filter((r) => r.name.toLowerCase() === w);
    if (m.length !== 1) m = routines.filter((r) => r.name.toLowerCase().indexOf(w) === 0);
    if (m.length !== 1) m = routines.filter((r) => r.name.toLowerCase().indexOf(w) >= 0);
    if (m.length !== 1) return { error: m.length ? '"' + raw[i].trim() + '" matches more than one routine' : 'No routine matches "' + raw[i].trim() + '"' };
    out.push(m[0].id);
  }
  if (!out.length) return { error: 'Type your split, like: push, pull, legs, rest' };
  return { cycle: out };
}

async function renameExercise(oldKey, newName) {
  const me = state.me.id;
  const nn = newName.trim();
  if (!nn) { toast('Enter a name', 'err'); return false; }
  const names = Array.from(new Set(state.mine.filter((r) => key(r.exercise) === oldKey).map((r) => r.exercise)));
  const known = myExercises().find((m) => m.k === key(nn) && m.k !== oldKey);
  const target = known ? known.name : nn;
  for (let i = 0; i < names.length; i += 1) {
    const res = await db.from('workouts').update({ exercise: target }).eq('profile_id', me).eq('exercise', names[i]);
    if (res.error) { toast(res.error.message, 'err'); return false; }
  }
  state.workouts.forEach((w) => { if (w.profile_id === me && key(w.exercise) === oldKey) w.exercise = target; });
  const rs = state.routines.filter((r) => r.profile_id === me && r.exercises.some((x) => key(x) === oldKey));
  for (let i = 0; i < rs.length; i += 1) {
    const seen = new Set();
    const ex = [];
    rs[i].exercises.forEach((x) => {
      const nx = key(x) === oldKey ? target : x;
      if (!seen.has(key(nx))) { seen.add(key(nx)); ex.push(nx); }
    });
    const res = await db.from('routines').update({ exercises: ex }).eq('id', rs[i].id).eq('profile_id', me);
    if (!res.error) rs[i].exercises = ex;
  }
  const nk = key(target);
  const pref = state.exMap[oldKey];
  if (pref && nk !== oldKey) {
    if (!state.exMap[nk]) {
      const body = Object.assign({}, pref, { key: nk });
      await db.from('exercise_settings').upsert(body, { onConflict: 'profile_id,key' });
      state.exSettings.push(body);
    }
    await db.from('exercise_settings').delete().eq('profile_id', me).eq('key', oldKey);
    state.exSettings = state.exSettings.filter((x) => !(x.profile_id === me && x.key === oldKey));
  }
  derive();
  render();
  toast(known ? 'Merged into ' + target : 'Renamed');
  return true;
}

/* rest timer (fixed 3:00 after every working set) */

let audioCtx = null;
function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* no audio, that is fine */ }
}
/* three quick beeps, the last one higher */
function beep() {
  if (!state.restSound) return;
  try {
    unlockAudio();
    const ctx = audioCtx;
    if (!ctx) return;
    const t0 = ctx.currentTime + 0.02;
    [0, 0.3, 0.6].forEach((d, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.4, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.24);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t0 + d);
      o.stop(t0 + d + 0.27);
    });
  } catch (e) { /* ignore */ }
}
function toggleSound() {
  state.restSound = !state.restSound;
  lsSet('gym_rest_sound', state.restSound ? '1' : '0');
  if (state.restSound) beep();
  render();
}

/* keep the screen on while the app is open, so the rest timer can beep */
let wakeLock = null;
const wakeOK = () => typeof navigator !== 'undefined' && 'wakeLock' in navigator;
async function applyWake() {
  if (!wakeOK()) return;
  try {
    const want = state.keepAwake && !!state.me && !document.hidden;
    if (want && !wakeLock) {
      const lock = await navigator.wakeLock.request('screen');
      wakeLock = lock;
      lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
    } else if (!want && wakeLock) {
      const lock = wakeLock;
      wakeLock = null;
      await lock.release();
    }
  } catch (e) { wakeLock = null; }
}
let restTimer = null;
function startRest() {
  state.rest = { end: Date.now() + REST_SECS * 1000, total: REST_SECS * 1000 };
  const box = $('rest');
  box.replaceChildren(
    h('div', { class: 'restfill', id: 'restfill' }),
    h('span', { class: 'rl', text: 'REST' }),
    h('span', { class: 'rt', id: 'resttime', text: '' }),
    h('button', { text: '-15s', onclick: () => { if (state.rest) { state.rest.end -= 15000; tickRest(); } } }),
    h('button', { text: '+15s', onclick: () => { if (state.rest) { state.rest.end += 15000; state.rest.total += 15000; tickRest(); } } }),
    h('button', { text: 'skip', onclick: () => { state.rest = null; tickRest(); } })
  );
  box.classList.add('on');
  tickRest();
  if (!restTimer) restTimer = setInterval(tickRest, 250);
}
function stopRestTimer() {
  $('rest').classList.remove('on');
  if (restTimer) { clearInterval(restTimer); restTimer = null; }
}
function tickRest() {
  if (!state.rest) { stopRestTimer(); return; }
  const left = state.rest.end - Date.now();
  if (left <= 0) {
    state.rest = null;
    stopRestTimer();
    toast('Rest over. Next set.');
    beep();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    return;
  }
  const s = Math.ceil(left / 1000);
  $('resttime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('restfill').style.width = Math.max(0, Math.min(100, (left / state.rest.total) * 100)) + '%';
}
function toggleRest() {
  state.restOn = !state.restOn;
  lsSet('gym_rest_on', state.restOn ? '1' : '0');
  if (!state.restOn) { state.rest = null; stopRestTimer(); }
  render();
}

/* plate calculator */

function plateMath(target, bar, plates) {
  const per = (target - bar) / 2;
  if (per < 0) return { under: true };
  let left = per;
  const out = [];
  plates.forEach((p) => {
    const n = Math.floor((left + 1e-9) / p);
    if (n > 0) { out.push([p, n]); left -= n * p; }
  });
  return { out, short: left > 0.01 ? left : 0, per };
}

function openPlates(startW) {
  const kg = state.unit === 'kg';
  const bars = kg ? [20, 15] : [45, 35];
  const plates = kg ? [25, 20, 15, 10, 5, 2.5, 1.25] : [45, 35, 25, 10, 5, 2.5];
  let bar = bars[0];
  const wIn = h('input', { class: 'field', type: 'number', inputmode: 'decimal', step: 'any', placeholder: 'target weight (' + unit() + ')', value: startW > 0 ? fmtW(startW) : '' });
  const out = h('div', { class: 'plates' });
  const barRow = h('div', { class: 'chiprow' });
  function drawBars() {
    barRow.replaceChildren(h('span', { class: 'muted', text: 'bar:' }));
    bars.forEach((b) => barRow.appendChild(h('button', {
      class: 'chip' + (b === bar ? ' on' : ''),
      onclick: () => { bar = b; drawBars(); draw(); },
      text: b + ' ' + unit()
    })));
  }
  function draw() {
    const target = parseFloat(wIn.value);
    out.replaceChildren();
    if (!Number.isFinite(target)) { out.appendChild(h('div', { class: 'muted', text: 'Enter a target weight.' })); return; }
    const res = plateMath(target, bar, plates);
    if (res.under) { out.appendChild(h('div', { class: 'muted', text: 'That is under the empty bar (' + bar + ' ' + unit() + ').' })); return; }
    if (!res.out.length) { out.appendChild(h('div', { text: 'Just the bar.' })); return; }
    out.appendChild(h('div', { class: 'muted', text: 'Per side:' }));
    const row = h('div');
    res.out.forEach((p) => row.appendChild(h('span', { class: 'platechip', text: p[0] + ' × ' + p[1] })));
    out.appendChild(row);
    if (res.short) out.appendChild(h('div', { class: 'muted', text: 'Short by ' + fmtW(res.short * 2) + ' ' + unit() + ' total with these plates.' }));
  }
  wIn.addEventListener('input', draw);
  openSheet([sheetHead('Plate calculator'), wIn, barRow, out]);
  drawBars();
  draw();
}

/* warmup sets */

function warmupPlan(work) {
  const bar = state.unit === 'kg' ? 20 : 45;
  const step = state.unit === 'kg' ? 2.5 : 5;
  if (!(work > bar * 1.25)) return [];
  const round = (x) => Math.max(bar, Math.round(x / step) * step);
  const raw = [[bar, 10], [round(work * 0.4), 8], [round(work * 0.6), 5], [round(work * 0.8), 3]];
  const out = [];
  raw.forEach((s) => { if (s[0] < work && !out.some((o) => o[0] === s[0])) out.push(s); });
  return out;
}

function openWarmup(name, work) {
  const wIn = h('input', { class: 'field', type: 'number', inputmode: 'decimal', step: 'any', placeholder: 'working weight (' + unit() + ')', value: work > 0 ? fmtW(work) : '' });

    go.classList.toggle('hidden', !plan.length);
    if (!plan.length) { out.appendChild(h('div', { class: 'muted', text: 'Enter a working weight above the empty bar.' })); return; }
    plan.forEach((s, i) => out.appendChild(h('div', { class: 'lrow' },

      h('div', { class: 'r', text: fmtW(s[0]) + ' × ' + s[1] })
    )));

  openSheet([sheetHead('Warmup: ' + name), wIn, out, go]);

}

function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadText(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportWorkouts() {

/* finish workout */

function openFinish(date) {
  const rows = state.mine.filter((r) => r.date === date).sort(byTime);
  const work = rows.filter((r) => !isWarm(r));
  if (!work.length) { toast('Log a working set first', 'err'); return; }
  const sets = work.reduce((s, r) => s + r.sets, 0);
  const volume = work.reduce((s, r) => s + vol(r), 0);
  const groups = [];
  work.forEach((r) => {
    const k = key(r.exercise);
    let g = groups.find((x) => x.k === k);
    if (!g) { g = { k, name: r.exercise, n: 0, vol: 0, top: r }; groups.push(g); }
    g.n += r.sets;
    g.vol += vol(r);
    if (Number(r.weight) > Number(g.top.weight) + 0.0005) g.top = r;
  });
  let dur = null;
  if (date === today() && rows.length > 1) {
    const ts = rows.map((r) => new Date(r.created_at).getTime());
    const span = Math.max.apply(null, ts) - Math.min.apply(null, ts);
    if (span > 0 && span < 6 * 3600 * 1000) dur = Math.max(1, Math.round(span / 60000));
  }
  const prs = work.filter((r) => state.prIds.has(r.id));

  /* compare with the earlier day that had the most lifts in common */
  const keys = new Set(groups.map((g) => g.k));
  const prevDays = {};
  state.mine.forEach((r) => {
    if (isWarm(r) || r.date >= date) return;
    (prevDays[r.date] = prevDays[r.date] || []).push(r);
  });
  let cmp = null;
  Object.keys(prevDays).sort().forEach((d) => {
    const shared = new Set(prevDays[d].map((r) => key(r.exercise)).filter((k) => keys.has(k)));
    if (shared.size / keys.size < 0.5) return;
    if (!cmp || shared.size >= cmp.n) cmp = { d, n: shared.size, shared };
  });
  let cmpLine = null;
  if (cmp) {
    const before = prevDays[cmp.d].filter((r) => cmp.shared.has(key(r.exercise))).reduce((s, r) => s + vol(r), 0);
    const now = work.filter((r) => cmp.shared.has(key(r.exercise))).reduce((s, r) => s + vol(r), 0);
    if (before > 0) {
      const pct = Math.round(((now - before) / before) * 100);
      cmpLine = (pct >= 0 ? '+' : '') + pct + '% volume vs ' + shortDate(cmp.d) + ' (same lifts)';
    }
  }
  const atGym = statusOf(myProfile()).atGym;
  const done = h('button', { class: 'btn', text: atGym ? 'done, check me out' : 'done' });
  done.addEventListener('click', async () => {
    closeSheet();
    state.rest = null;
    stopRestTimer();
    if (atGym) await toggleAtGym();
  });
  const share = h('button', { class: 'btn ghost', style: 'margin-top:8px', text: 'share to homies chat' });
  share.addEventListener('click', async () => {
    share.disabled = true;
    const row = await postChat({
      kind: 'workout', body: 'Workout done',
      meta: {
        date, sets, volume: volume, dur,
        exercises: groups.map((g) => ({ name: g.name, n: g.n, w: Number(g.top.weight), r: g.top.reps })),
        prs: Array.from(new Set(prs.map((r) => r.exercise))).map((n) => ({ name: n }))
      }
    });
    if (row) { share.textContent = 'shared'; toast('Shared to chat'); } else share.disabled = false;
  });
  openSheet([
    sheetHead('Workout done'),
    h('div', { class: 'tiles three' },
      h('div', { class: 'tile' }, h('b', { text: String(sets) }), h('span', { text: 'SETS' })),
      h('div', { class: 'tile' }, h('b', { text: fmt(toDisp(volume)) }), h('span', { text: 'VOLUME ' + unit().toUpperCase() })),
      h('div', { class: 'tile' }, h('b', { text: dur ? dur + 'm' : String(groups.length) }), h('span', { text: dur ? 'DURATION' : 'EXERCISES' }))
    ),
    cmpLine ? h('div', { class: 'hint' }, cmpLine) : null,
    prs.length ? h('h3', { text: 'PERSONAL RECORDS' }) : null,
    prs.map((r) => h('div', { class: 'lrow' }, h('div', { class: 'l', text: r.exercise }), h('div', { class: 'r' }, dw(r.weight) + ' ' + unit() + ' × ' + r.reps, h('small', { text: 'new PR' })))),
    h('h3', { text: 'EXERCISES' }),
    groups.map((g) => h('div', { class: 'lrow' },
      h('div', { class: 'l', text: g.name }),
      h('div', { class: 'r' }, g.n + (g.n === 1 ? ' set' : ' sets'), h('small', { text: 'top ' + dw(g.top.weight) + ' × ' + g.top.reps }))
    )),
    h('div', { style: 'margin-top:14px' }, done, share)
  ]);
}

/* homies chat (polls the database, no realtime setup needed) */

const RX = ['💪', '🔥', '👏', '😂', '❤️', '🙌'];
const CHAT_FETCH = 150;
const byCreated = (a, b) => (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0);
const ts = (iso) => new Date(iso).getTime();

async function fetchChat() {
  const m = await db.from('messages').select('id, profile_id, body, kind, meta, edited, created_at').order('created_at', { ascending: false }).range(0, CHAT_FETCH - 1);
  if (m.error) throw m.error;
  const r = await db.from('message_reactions').select('message_id, profile_id, emoji, created_at').order('created_at', { ascending: false }).range(0, 599);
  if (r.error) throw r.error;
  return { msgs: m.data.slice().sort(byCreated), rx: r.data };
}

function chatInit() {
  const s = parseInt(lsGet('gym_chat_seen_' + state.me.id), 10);
  state.chat = { msgs: [], rx: [], open: false, seen: Number.isFinite(s) ? s : Date.now(), unread: 0, error: '', timer: null };
  if (!Number.isFinite(s)) lsSet('gym_chat_seen_' + state.me.id, String(state.chat.seen));
  state.autopost = lsGet('gym_autopost') !== '0';
  setChatInterval();
  pollChat();
}

function chatStop() {
  if (state.chat && state.chat.timer) clearInterval(state.chat.timer);
  state.chat = { msgs: [], rx: [], open: false, seen: 0, unread: 0, error: '', timer: null };
  const p = $('chat');
  if (p) { p.classList.add('hidden'); p.replaceChildren(); }
  updateChatDot();
}

function setChatInterval() {
  const c = state.chat;
  if (c.timer) clearInterval(c.timer);
  c.timer = setInterval(pollChat, c.open ? 4000 : 30000);
}

function markSeen() {
  const c = state.chat;
  if (!c.msgs.length) return;
  const newest = Math.max.apply(null, c.msgs.map((m) => ts(m.created_at)));
  if (newest > c.seen) { c.seen = newest; lsSet('gym_chat_seen_' + state.me.id, String(newest)); }
  c.unread = 0;
}

function updateChatDot() {
  const d = $('chatDot');
  if (!d) return;
  const n = state.chat ? state.chat.unread : 0;
  d.textContent = n > 9 ? '9+' : String(n);
  d.classList.toggle('on', n > 0);
}

async function pollChat() {
  if (!state.me || !state.chat || document.hidden) return;
  try {
    const d = await fetchChat();
    const c = state.chat;
    c.error = '';
    c.msgs = d.msgs;
    c.rx = d.rx;
    if (c.open) markSeen();
    else c.unread = c.msgs.filter((m) => m.profile_id !== state.me.id && ts(m.created_at) > c.seen).length;
  } catch (e) {
    state.chat.error = (e && e.message) || String(e);
    state.chat.unread = 0;
  }
  updateChatDot();
  if (state.chat.open) renderChatList(false);
}

async function postChat(row) {
  const res = await db.from('messages').insert(Object.assign({ profile_id: state.me.id }, row)).select().single();
  if (res.error) { toast(res.error.message + ' (run setup6.sql?)', 'err'); return null; }
  state.chat.msgs.push(res.data);
  markSeen();
  if (state.chat.open) renderChatList(true);
  return res.data;
}

/* PRs post themselves. Several PRs on one lift within 2 hours update the same message. */
async function autoPostPR(name, wLb, reps) {
  if (!state.autopost || !state.chat) return;
  const k = key(name);
  const meta = { exercise: name, weight: wLb, reps };
  const prev = state.prPosted[k];
  try {
    if (prev && Date.now() - prev.t < 2 * 3600 * 1000) {
      const res = await db.from('messages').update({ meta }).eq('id', prev.id).eq('profile_id', state.me.id);
      if (!res.error) {
        const m = state.chat.msgs.find((x) => x.id === prev.id);
        if (m) m.meta = meta;
        return;
      }
    }
    const row = await postChat({ kind: 'pr', body: name + ' PR', meta });
    if (row) state.prPosted[k] = { id: row.id, t: Date.now() };
  } catch (e) { /* chat is optional, never block logging */ }
}

async function toggleReaction(mid, emoji) {
  const me = state.me.id;
  const c = state.chat;
  const have = c.rx.find((r) => r.message_id === mid && r.profile_id === me && r.emoji === emoji);

    c.rx = c.rx.filter((r) => r !== have);
    renderChatList(false);
    const res = await db.from('message_reactions').delete().eq('message_id', mid).eq('profile_id', me).eq('emoji', emoji);

  } else {

    renderChatList(false);
    const res = await db.from('message_reactions').insert({ message_id: mid, profile_id: me, emoji });

}

function renderChatList(stick) {
  const list = $('chatlist');
  if (!list) return;
  const c = state.chat;
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 90;
  list.replaceChildren();
  if (c.error) {
    const hint = /messages|message_reactions|schema cache|does not exist/i.test(c.error) ? 'Run setup6.sql in the Supabase SQL Editor to turn chat on.' : 'Could not load messages.';
    list.appendChild(h('div', { class: 'card errbox' }, h('p', { text: c.error }), h('p', { class: 'muted', text: hint })));
    return;
  }
  if (!c.msgs.length) list.appendChild(emptyCard('Quiet in here', 'Say something to the homies. PRs and shared workouts show up here too.'));
  const rxBy = {};
  c.rx.forEach((r) => {
    if (!rxBy[r.message_id]) rxBy[r.message_id] = {};
    if (!rxBy[r.message_id][r.emoji]) rxBy[r.message_id][r.emoji] = [];
    rxBy[r.message_id][r.emoji].push(r.profile_id);
  });
  let lastDay = '';
  const t0 = today();
  c.msgs.forEach((m) => {
    const d = new Date(m.created_at);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    const day = d.toISOString().slice(0, 10);
    if (day !== lastDay) {
      lastDay = day;
      list.appendChild(h('div', { class: 'daydiv', text: day === t0 ? 'Today' : day === addDays(t0, -1) ? 'Yesterday' : shortDate(day) }));
    }
    const p = state.profiles.find((x) => x.id === m.profile_id);
    const mine = m.profile_id === state.me.id;
    const pills = rxBy[m.id] ? Object.keys(rxBy[m.id]).map((e) => {
      const who = rxBy[m.id][e];
      return h('button', {
        class: 'rx' + (who.indexOf(state.me.id) >= 0 ? ' on' : ''),
        onclick: (ev) => { ev.stopPropagation(); toggleReaction(m.id, e); },
        text: e + ' ' + who.length
      });
    }) : null;
    const time = new Date(m.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    list.appendChild(h('div', { class: 'msg' + (mine ? ' me' : '') },
      p ? h('span', { class: 'tap', onclick: () => openProfile(p.id) }, avatar(p, 26)) : h('span', { class: 'av', style: 'width:26px;height:26px' }),
      h('div', { class: 'mcol' },

/* training days (lifting or other activity) */

const ACT_KINDS = ['Run', 'Walk', 'Bike', 'Swim', 'Sports', 'Mobility', 'Other'];

function trainDays(pid) {
  const s = new Set();
  (state.byUser[pid] || []).forEach((r) => { if (!isWarm(r)) s.add(r.date); });
  (state.actByUser[pid] || []).forEach((a) => s.add(a.date));
  return Array.from(s).sort();
}

/* 'lifted', or the kind of other activity, or null when nothing was done that day */
function dayKind(pid, date) {
  if ((state.byUser[pid] || []).some((r) => r.date === date && !isWarm(r))) return 'lifted';
  const a = (state.actByUser[pid] || []).find((x) => x.date === date);
  return a ? a.kind.toLowerCase() : null;
}

/* repeat a past session */

function lastRoutineSession(r, before) {
  const rk = new Set(r.exercises.map(key));
  if (!rk.size) return null;
  const byDay = {};
  state.mine.forEach((w) => {
    if (isWarm(w) || w.date >= before) return;
    (byDay[w.date] = byDay[w.date] || []).push(w);
  });
  let best = null;
  Object.keys(byDay).sort().forEach((d) => {
    const shared = new Set(byDay[d].map((w) => key(w.exercise)).filter((k) => rk.has(k)));
    if (shared.size >= Math.max(1, Math.ceil(rk.size * 0.6))) best = d;
  });
  return best ? { date: best, rows: byDay[best].slice().sort(byTime) } : null;
}

async function repeatSession(sess) {
  const rows = sess.rows.map((w) => ({
    profile_id: state.me.id, exercise: w.exercise, weight: w.weight, reps: w.reps, sets: w.sets,
    date: state.logDate, rpe: null, set_type: w.set_type

  if (res.error) { toast(res.error.message, 'err'); return; }
  res.data.forEach((r) => state.workouts.push(normSet(r)));
  state.loadedRoutine = null;
  derive();
  render();
  toast('Logged ' + rows.length + ' sets from ' + shortDate(sess.date) + '. Edit what changed.');
}

/* goals */

function goalProgress(g) {
  const k = key(g.exercise);
  const need = g.reps || 1;
  const target = Number(g.target);
  let best = 0;
  let doneOn = null;
  (state.byUser[g.profile_id] || []).slice().sort(byTime).forEach((r) => {
    if (key(r.exercise) !== k || isWarm(r) || r.reps < need) return;
    const w = Number(r.weight);
    if (w > best) best = w;
    if (!doneOn && w >= target - 0.0005) doneOn = r.date;
  });
  return { best, pct: target > 0 ? Math.min(1, best / target) : 0, done: !!doneOn, doneOn };
}

function goalRow(g, editable) {
  const gp = goalProgress(g);
  const c = colorOf(g.profile_id);
  let sub;
  if (gp.done) sub = 'reached ' + shortDate(gp.doneOn);
  else if (g.deadline) {
    const left = daysBetween(today(), g.deadline);
    sub = left >= 0 ? left + ' days left' : 'overdue by ' + (-left) + ' days';
  } else sub = 'no deadline';
  const row = h('div', { class: 'goal' + (editable ? ' tap' : ''), onclick: editable ? () => openGoalSheet(g) : null },
    h('div', { class: 'lrow', style: 'border-top:none;padding:0' },
      h('div', { class: 'l' }, h('div', { text: g.exercise }), h('small', { text: dw(g.target) + ' ' + unit() + (g.reps > 1 ? ' for ' + g.reps + ' reps' : '') })),
      h('div', { class: 'r' }, gp.done ? h('span', { class: 'pill done', text: 'DONE' }) : Math.round(gp.pct * 100) + '%', h('small', { text: sub }))
    ),
    h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.max(2, Math.round(gp.pct * 100)) + '%;background:' + (gp.done ? '#39d353' : c) })),
    h('small', { class: 'muted', style: 'font-size:10px', text: 'best so far ' + dw(gp.best) + ' ' + unit() })
  );
  return row;
}

function goalsCard(pid, editable, showOwner) {
  const gs = state.goals.filter((g) => g.profile_id === pid);
  const card = h('div', { class: 'card' });
  if (!gs.length) card.appendChild(h('div', { class: 'muted', text: 'No goals yet.' }));
  gs.slice().sort((a, b) => (goalProgress(a).done ? 1 : 0) - (goalProgress(b).done ? 1 : 0)).forEach((g) => card.appendChild(goalRow(g, editable)));
  if (editable) card.appendChild(h('button', { class: 'btn ghost', style: 'margin-top:12px', onclick: () => openGoalSheet(), text: '+ new goal' }));
  return card;
}

async function saveGoal(id, row) {

  render();
  return true;

/* badges (worked out from your data, nothing stored) */

function badgesFor(pid) {
  const rows = (state.byUser[pid] || []).filter((r) => !isWarm(r));
  const days = trainDays(pid).length;
  const sk = streakOf(pid);
  const prs = rows.filter((r) => state.prIds.has(r.id)).length;
  const volume = rows.reduce((s, r) => s + vol(r), 0);
  const heavy = (re, not) => rows.reduce((m, r) => (re.test(r.exercise) && !(not && not.test(r.exercise)) ? Math.max(m, Number(r.weight)) : m), 0);
  const owner = {};
  state.workouts.forEach((w) => { owner[w.id] = w.profile_id; });
  const gave = state.kudos.filter((k) => k.from_profile === pid).length;
  const got = state.kudos.filter((k) => owner[k.workout_id] === pid).length;
  const wk = weekStreak(rows);
  const goalsDone = state.goals.filter((g) => g.profile_id === pid && goalProgress(g).done).length;
  const weighIns = state.bodyweights.filter((b) => b.profile_id === pid).length;
  const acts = (state.actByUser[pid] || []).length;
  const list = [];
  const add = (name, desc, have, need, fmtFn) => list.push({ name, desc, have, need, earned: have >= need, prog: (fmtFn || String)(Math.min(have, need)) + ' / ' + (fmtFn || String)(need) });
  add('First rep', 'Train once', days, 1);
  add('Regular', 'Train on 10 days', days, 10);
  add('Dedicated', 'Train on 50 days', days, 50);
  add('Centurion', 'Train on 100 days', days, 100);
  add('On a roll', 'Reach a 4 day streak', sk.best, 4);
  add('Locked in', 'Reach a 10 day streak', sk.best, 10);
  add('Unstoppable', 'Reach a 30 day streak', sk.best, 30);
  add('Consistent', 'Hit 3+ days a week for 4 weeks in a row', wk, 4);
  add('Machine', 'Hit 3+ days a week for 12 weeks in a row', wk, 12);
  add('PR hunter', 'Set your first PR', prs, 1);
  add('PR machine', 'Set 10 PRs', prs, 10);
  add('PR legend', 'Set 50 PRs', prs, 50);
  const volFmt = (v) => fmt(toDisp(v)) + ' ' + unit();
  add('Mover', 'Move 50,000 lb in total', volume, 50000, volFmt);

/* head to head */

function openH2H(aId, bId) {
  const A = state.profiles.find((p) => p.id === aId);
  const B = state.profiles.find((p) => p.id === bId);
  if (!A || !B) return;
  const since = addDays(today(), -29);
  const stat = (p) => {
    const rows = (state.byUser[p.id] || []).filter((r) => !isWarm(r));
    const sk = streakOf(p.id);
    return {
      rows, cur: sk.cur, best: sk.best,
      days30: trainDays(p.id).filter((d) => d >= since).length,
      vol30: rows.filter((r) => r.date >= since).reduce((s, r) => s + vol(r), 0),
      prs: rows.filter((r) => state.prIds.has(r.id)).length
    };
  };
  const a = stat(A);
  const b = stat(B);
  let aw = 0;
  let bwn = 0;
  const lines = [];
  const vs = (label, x, y, fx, fy) => {
    const xa = x > y + 0.0005;
    const yb = y > x + 0.0005;
    if (xa) aw += 1;
    if (yb) bwn += 1;
    lines.push(h('div', { class: 'vsrow' },
      h('span', { text: label }),
      h('span', { class: 'c' + (xa ? ' win' : ''), text: fx }),
      h('span', { class: 'c' + (yb ? ' win' : ''), text: fy })
    ));
  };
  vs('Current streak', a.cur, b.cur, a.cur + 'd', b.cur + 'd');
  vs('Best streak', a.best, b.best, a.best + 'd', b.best + 'd');
  vs('Training days, 30d', a.days30, b.days30, String(a.days30), String(b.days30));
  vs('Volume, 30d', a.vol30, b.vol30, fmt(toDisp(a.vol30)), fmt(toDisp(b.vol30)));
  vs('Total PRs', a.prs, b.prs, String(a.prs), String(b.prs));

  const bestOf = (rows, k) => {
    let m = null;
    rows.forEach((r) => {
      if (!qual(r) || key(r.exercise) !== k) return;
      const e = e1rm(Number(r.weight), r.reps, r.rpe);
      if (!m || e > m) m = e;
    });
    return m;
  };
  const common = {};
  a.rows.forEach((r) => { if (qual(r)) common[key(r.exercise)] = common[key(r.exercise)] || { name: r.exercise, n: 0 }; });
  Object.keys(common).forEach((k) => {
    const eb = bestOf(b.rows, k);
    if (eb === null) { delete common[k]; return; }
    common[k].n = a.rows.filter((r) => key(r.exercise) === k).length + b.rows.filter((r) => key(r.exercise) === k).length;
  });
  const shared = Object.keys(common).sort((x, y) => common[y].n - common[x].n).slice(0, 8);
  const liftLines = lines.length;
  shared.forEach((k) => {
    const ea = bestOf(a.rows, k);
    const eb = bestOf(b.rows, k);
    vs(common[k].name, ea, eb, fmt(toDisp(ea)), fmt(toDisp(eb)));
  });

  const sel = (cur, other, left) => h('select', {
    class: 'pick', style: 'margin:0',
    onchange: (e) => (left ? openH2H(e.target.value, other) : openH2H(other, e.target.value))
  }, state.profiles.map((p) => h('option', { value: p.id, selected: p.id === cur, text: p.username })));

  openSheet([
    sheetHead('Head to head'),
    h('div', { class: 'inrow' }, sel(aId, bId, true), sel(bId, aId, false)),
    h('div', { class: 'hint' }, aw === bwn ? 'All tied up, ' + aw + ' each.' : (aw > bwn ? A.username + ' leads ' + aw + ' to ' + bwn : B.username + ' leads ' + bwn + ' to ' + aw)),
    h('div', { class: 'vsrow head' }, h('span'), h('span', { class: 'c', text: A.username }), h('span', { class: 'c', text: B.username })),
    lines.slice(0, liftLines),
    shared.length ? h('h3', { text: 'SHARED LIFTS, BEST EST. 1RM (' + unit().toUpperCase() + ')' }) : null,
    lines.slice(liftLines),
    !shared.length ? h('div', { class: 'muted', style: 'margin-top:10px', text: 'No lifts in common yet.' }) : null
  ]);
}

/* change PIN */

async function changePin(cur, next) {
  if (!/^\d{4}$/.test(next)) { toast('New PIN must be 4 digits', 'err'); return false; }
  const row = await db.from('profiles').select('pin_hash').eq('id', state.me.id).single();
  if (row.error) { toast(row.error.message, 'err'); return false; }
  if (row.data.pin_hash !== await sha(state.me.username + ':' + cur)) { toast('Current PIN is wrong', 'err'); return false; }
  const res = await db.from('profiles').update({ pin_hash: await sha(state.me.username + ':' + next) }).eq('id', state.me.id);
  if (res.error) { toast(res.error.message, 'err'); return false; }
  toast('PIN changed');
  return true;
}

function sessionOrder(date) {
  const rows = state.mine.filter((r) => r.date === date).sort(byTime);
  const order = [];
  rows.forEach((r) => {
    const k = key(r.exercise);
    if (!order.some((o) => o.k === k)) order.push({ k, name: r.exercise });
  });
  if (state.extraDate === date) {
    state.extra.forEach((n) => {
      const k = key(n);
      if (!order.some((o) => o.k === k)) order.push({ k, name: n });
    });
  }
  /* supersets sit next to each other */
  const placed = new Set();
  const out = [];
  order.forEach((o) => {
    if (placed.has(o.k)) return;
    out.push(o);
    placed.add(o.k);
    const pk = ssPartner(date, o.k);
    const po = pk ? order.find((x) => x.k === pk) : null;
    if (po && !placed.has(pk)) { out.push(po); placed.add(pk); }
  });
  return out;
}

function scheduleCard(mine, mode) {
  const me = state.me.id;
  const st = settingsOf(me);
  const card = h('div', { class: 'card' });
  card.appendChild(seg([['weekly', 'by weekday'], ['rotation', 'rotating split']], mode, (v) => {
    if (v !== mode) saveSettings({ mode: v, pos: st ? st.pos : 0, pos_date: st && st.pos_date ? st.pos_date : today() });
  }));

  if (mode === 'weekly') {
    card.appendChild(h('div', { class: 'muted', style: 'margin-bottom:8px', text: 'Same plan every week, tied to the day of the week.' }));
    WD.forEach((label, wd) => {
      const cur = state.schMap[me + '|' + wd];
      const curId = cur && cur.routine_id ? cur.routine_id : 'rest';
      const sel = h('select', { class: 'pick' },
        h('option', { value: 'rest', selected: curId === 'rest', text: 'Rest' }),
        mine.map((r) => h('option', { value: r.id, selected: curId === r.id, text: r.name })),
        h('option', { value: 'new', text: '+ new routine...' })
      );
      sel.addEventListener('change', () => {
        if (sel.value === 'new') {
          sel.value = curId;
          openRoutineEditor({ id: null, name: '', exercises: [], assignWd: wd });
          return;
        }
        setWeekday(wd, sel.value === 'rest' ? null : sel.value);
      });
      card.appendChild(h('div', { class: 'wk' }, h('span', { class: 'muted', text: label.toUpperCase() }), sel));
    });
  } else {
    const cycle = st ? st.cycle : [];
    card.appendChild(h('div', { class: 'muted', style: 'margin-bottom:8px', text: 'Goes in order and only moves forward when you train. Miss a day and the split just waits. A Rest slot takes one calendar day.' }));
    if (cycle.length) {
      const r = rotationPos(me, today());
      const todayPlan = planFor(me, today());
      const nxt = r ? r.cycle[(r.p + (r.d > today() ? 0 : 1)) % r.n] : null;
      card.appendChild(h('div', { class: 'hint' },
        h('div', null, r && r.d > today() ? 'Trained today: ' : 'Today: ', h('b', { text: todayPlan.routine ? todayPlan.routine.name : 'Rest' })),
        h('div', null, 'Then: ', h('b', { text: nxt && state.routineById[nxt] ? state.routineById[nxt].name : 'Rest' }))
      ));
    }
    const setCycle = (c) => saveSettings({ cycle: c, pos: st ? Math.min(st.pos, Math.max(0, c.length - 1)) : 0, pos_date: st && st.pos_date ? st.pos_date : today() });
    cycle.forEach((id, i) => {
      const sel = h('select', { class: 'pick', style: 'margin:0;flex:1;min-width:0' },
        h('option', { value: 'rest', selected: id == null, text: 'Rest' }),
        mine.map((r) => h('option', { value: r.id, selected: id === r.id, text: r.name }))
      );
      sel.addEventListener('change', () => { const c = cycle.slice(); c[i] = sel.value === 'rest' ? null : sel.value; setCycle(c); });
      const move = (dir) => {
        const j = i + dir;
        if (j < 0 || j >= cycle.length) return;
        const c = cycle.slice(); const t = c[i]; c[i] = c[j]; c[j] = t; setCycle(c);
      };
      card.appendChild(h('div', { class: 'xrow' },
        h('span', { class: 'muted', style: 'flex:none;width:20px', text: String(i + 1) }),
        sel,
        h('button', { title: 'Move up', onclick: () => move(-1), text: '↑' }),
        h('button', { title: 'Move down', onclick: () => move(1), text: '↓' }),
        h('button', { title: 'Remove', onclick: () => { const c = cycle.slice(); c.splice(i, 1); setCycle(c); }, text: '×' })
      ));
    });
    card.appendChild(h('div', { class: 'btnrow' },
      h('button', { class: 'btn ghost', onclick: () => setCycle(cycle.concat([null])), text: '+ rest' }),
      h('button', {
        class: 'btn ghost',
        onclick: () => { if (!mine.length) { openRoutineEditor(); return; } setCycle(cycle.concat([mine[0].id])); },
        text: '+ routine'
      })
    ));
    if (mine.length) {
      const q = h('input', { class: 'field', style: 'margin:10px 0 6px', placeholder: 'or type it: push, pull, legs, rest', autocomplete: 'off' });
      const apply = () => {
        const res = parseSplit(q.value, mine);
        if (res.error) { toast(res.error, 'err'); return; }
        saveSettings({ cycle: res.cycle, pos: 0, pos_date: today() });
      };
      q.addEventListener('keydown', (e) => { if (e.key === 'Enter') apply(); });
      card.appendChild(q);
      card.appendChild(h('button', { class: 'btn ghost', onclick: apply, text: 'set split from text' }));
    }
    if (cycle.length) {
      card.appendChild(h('button', { class: 'btn ghost', style: 'margin-top:8px', onclick: () => saveSettings({ pos: 0, pos_date: today() }), text: 'restart at day 1 today' }));
    }
  }

  if (!mine.length) {
    card.appendChild(h('div', { class: 'muted', style: 'margin:12px 0 6px', text: 'No routines yet. Start from a template (you can edit it after) or build your own below.' }));
    TEMPLATES.forEach((t) => {
      card.appendChild(h('button', { class: 'btn ghost', style: 'margin-top:6px', onclick: () => applyTemplate(t) }, t.name + '  (' + (mode === 'rotation' ? t.cycleBlurb : t.blurb) + ')'));
    });
  }
  return card;
}

/* PROGRESS tab */

function weekStreak(rows) {
  const days = {};
  rows.forEach((r) => { const w = weekStart(r.date); (days[w] = days[w] || new Set()).add(r.date); });
  let ws = weekStart(today());
  let n = 0;
  if (days[ws] && days[ws].size >= WEEK_GOAL) n += 1;
  ws = addDays(ws, -7);
  while (days[ws] && days[ws].size >= WEEK_GOAL) { n += 1; ws = addDays(ws, -7); }
  return n;
}

function lastWeeks(n) {
  const ws = weekStart(today());
  const out = [];
  for (let i = n - 1; i >= 0; i -= 1) out.push(addDays(ws, -7 * i));
  return out;
}
function weeklyVolume(rows, weeks) {
  const m = {};
  weeks.forEach((w) => { m[w] = 0; });
  rows.forEach((r) => { const w = weekStart(r.date); if (w in m) m[w] += vol(r); });
  return weeks.map((w) => Math.round(toDisp(m[w])));
}

function heatmap(rows) {
  const start = addDays(weekStart(today()), -77);
  const counts = {};
  rows.forEach((r) => { counts[r.date] = (counts[r.date] || 0) + r.sets; });
  const t = today();
  const cells = [];
  for (let i = 0; i < 84; i += 1) {
    const d = addDays(start, i);
    const c = counts[d] || 0;
    const lvl = c === 0 ? 0 : c < 8 ? 1 : c < 16 ? 2 : c < 24 ? 3 : 4;
    cells.push(h('i', { class: 'l' + lvl + (d > t ? ' fut' : ''), title: shortDate(d) + ': ' + c + ' sets' }));
  }
  return h('div', null,
    h('div', { class: 'heat' }, cells),
    h('div', { class: 'legend' }, 'less ', h('i'), h('i', { style: 'background:#0e4429' }), h('i', { style: 'background:#006d32' }), h('i', { style: 'background:#26a641' }), h('i', { style: 'background:#39d353' }), ' more')
  );
}

  ));

  wrap.appendChild(h('h2', null, 'Personal records', h('small', { text: 'HEAVIEST SET' })));

  exs.slice(0, 10).forEach((e) => {
    const rs = work.filter((r) => key(r.exercise) === e.k);
    const top = topSet(rs);
    prCard.appendChild(h('div', { class: 'lrow' },
      h('div', { class: 'l' }, h('div', { text: e.name }), h('small', { text: shortDate(top.date) })),

    ));
  });
  wrap.appendChild(prCard);
  return wrap;
}

/* HOMIES tab */

function rangeStart(range) {
  if (range === 'week') return weekStart(today());
  if (range === 'month') return today().slice(0, 7) + '-01';
  return '0000-00-00';
}

function crewStats(start, end) {
  return state.profiles.map((p) => {
    const rows = (state.byUser[p.id] || []).filter((r) => !isWarm(r) && r.date >= start && (!end || r.date <= end));
    return {
      p,
      volume: rows.reduce((s, r) => s + vol(r), 0),
      sets: rows.reduce((s, r) => s + r.sets, 0),
      days: new Set(rows.map((r) => r.date).concat((state.actByUser[p.id] || []).filter((a) => a.date >= start && (!end || a.date <= end)).map((a) => a.date))).size,
      prs: rows.filter((r) => state.prIds.has(r.id)).length
    };
  });
}

function metricText(metric, v) {
  if (metric === 'volume') return fmt(toDisp(v)) + ' ' + unit();
  if (metric === 'sets') return v + ' sets';
  if (metric === 'days') return v + (v === 1 ? ' day' : ' days');
  return v + (v === 1 ? ' PR' : ' PRs');
}

function lbRow(i, p, valText, sub, frac) {
  const c = colorOf(p.id);
  const st = statusOf(p);
  return h('div', { class: 'lb' + (p.id === state.me.id ? ' me' : '') },
    h('div', { class: 'rank r' + (i + 1), text: String(i + 1) }),
    h('div', null,
      h('div', { class: 'lbname tap', onclick: () => openProfile(p.id) }, avatar(p, 22), p.username,
        st.atGym ? h('em', { text: 'AT GYM' }) : null,
        st.slacking ? h('em', { class: 'slackem', style: 'color:#f87171;border-color:rgba(248,113,113,0.4)', text: 'SLACKING' }) : null),
      h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.max(2, Math.round(frac * 100)) + '%;background:' + c }))
    ),
    h('div', { class: 'lbval' }, valText, sub ? h('small', { text: sub }) : null)
  );
}

function bestE1(pid, k, start, end) {
  let best = null;
  (state.byUser[pid] || []).forEach((r) => {
    if (key(r.exercise) !== k || !qual(r)) return;
    if (start && r.date < start) return;
    if (end && r.date > end) return;
    const e = e1rm(Number(r.weight), r.reps, r.rpe);
    if (!best || e > best.e) best = { e, r };
  });
  return best;
}

function statusPills(p) {
  const st = statusOf(p);
  const out = [];
  if (st.atGym) out.push(h('span', { class: 'pill gym', text: 'AT THE GYM' }));
  if (st.slacking) out.push(h('span', { class: 'pill slack', text: 'SLACKING ' + st.idle + 'D' }));
  else if (st.trainedToday) out.push(h('span', { class: 'pill done', text: 'TRAINED TODAY' }));
  else if (st.kind === 'new') out.push(h('span', { class: 'pill ok', text: 'NO SETS YET' }));
  else {
    const plan = planFor(p.id, today());
    if (hasSchedule(p.id) && !plan.routine) out.push(h('span', { class: 'pill off', text: 'REST DAY' }));
    else out.push(h('span', { class: 'pill ok', text: 'LAST ' + shortDate(st.lastDate).toUpperCase() }));
  }
  return out;
}

function recapCard() {
  const lw = addDays(weekStart(today()), -7);
  const le = addDays(lw, 6);
  const st = crewStats(lw, le);
  const sessions = st.reduce((s, x) => s + x.days, 0);
  if (!sessions) return null;
  const top = (field) => st.slice().sort((a, b) => b[field] - a[field])[0];
  const card = h('div', { class: 'card' });
  const row = (label, p, val) => card.appendChild(h('div', { class: 'lrow' },
    h('div', { class: 'l' }, h('small', { text: label }), h('div', { class: 'lbname' }, avatar(p, 20), p.username)),
    h('div', { class: 'r', text: val })
  ));
  const d = top('days');
  row('MOST SESSIONS', d.p, d.days + (d.days === 1 ? ' session' : ' sessions'));
  const v = top('volume');
  if (v.volume > 0) row('MOST VOLUME', v.p, fmt(toDisp(v.volume)) + ' ' + unit());
  const pr = top('prs');
  if (pr.prs > 0) row('MOST PRS', pr.p, pr.prs + (pr.prs === 1 ? ' PR' : ' PRs'));
  const sk = state.profiles.map((p) => Object.assign({ p }, streakOf(p.id))).sort((a, b) => b.cur - a.cur)[0];
  if (sk && sk.cur > 1) row('LONGEST STREAK', sk.p, sk.cur + ' days');
  const quiet = state.profiles.filter((p) => statusOf(p).slacking);
  if (quiet.length) {
    card.appendChild(h('div', { class: 'lrow' },
      h('div', { class: 'l' }, h('small', { text: 'WENT QUIET' }), h('div', { text: quiet.map((p) => p.username).join(', ') })),
      h('div', { class: 'r' }, h('span', { class: 'pill slack', text: 'SLACKING' }))
    ));
  }
  card.appendChild(h('div', { class: 'muted', style: 'margin-top:8px;font-size:10px', text: sessions + ' sessions and ' + fmt(toDisp(st.reduce((s, x) => s + x.volume, 0))) + ' ' + unit() + ' moved by the homies' }));
  return h('div', null, h('h2', null, 'Last week', h('small', { text: shortDate(lw).toUpperCase() + ' TO ' + shortDate(le).toUpperCase() })), card);
}

function renderCrew() {
  const wrap = h('div', { class: 'fade' });
  wrap.appendChild(h('div', { class: 'eyebrow', text: 'HOMIES' }));
  wrap.appendChild(h('h1', null, 'The ', h('span', { class: 'accent', text: 'homies' })));

  wrap.appendChild(seg([['today', 'today'], ['boards', 'boards'], ['activity', 'activity']], state.crewTab, (v) => { state.crewTab = v; render(); window.scrollTo(0, 0); }));
  const sections = { today: h('div'), boards: h('div'), activity: h('div') };
  let sink = sections.today;

  const meP = myProfile();
  const meSt = statusOf(meP);

  /* who is where */
  const stCard = h('div', { class: 'card' });
  state.profiles.forEach((p) => {
    const plan = planFor(p.id, today());
    stCard.appendChild(h('div', { class: 'lrow' },

  }));
  sink.appendChild(stCard);

  /* tiles */
  const wk = crewStats(weekStart(today()));
  sink.appendChild(h('div', { class: 'tiles three', style: 'margin-top:12px' },
    h('div', { class: 'tile' }, h('b', { text: String(wk.reduce((s, x) => s + x.days, 0)) }), h('span', { text: 'SESSIONS THIS WEEK' })),
    h('div', { class: 'tile' }, h('b', { text: fmt(toDisp(wk.reduce((s, x) => s + x.volume, 0))) }), h('span', { text: 'VOLUME ' + unit().toUpperCase() })),
    h('div', { class: 'tile' }, h('b', { text: String(wk.reduce((s, x) => s + x.prs, 0)) }), h('span', { text: 'PRS THIS WEEK' }))
  ));

  const recap = recapCard();
  if (recap) sink.appendChild(recap);

  /* challenges */
  sink = sections.boards;
  const t = today();
  const ym = t.slice(0, 7);
  const mStart = ym + '-01';
  const mEnd = ym + '-' + String(daysInMonth(ym)).padStart(2, '0');
  sink.appendChild(h('h2', null, 'Challenges'));
  const chCard = h('div', { class: 'card' });
  const mv = crewStats(mStart, mEnd).sort((a, b) => b.volume - a.volume);
  const mtop = mv.length ? Math.max(mv[0].volume, 1) : 1;
  chCard.appendChild(h('div', { class: 'chal' },
    h('div', { class: 'chalhead' }, h('b', { text: 'Monthly volume' }), h('small', { class: 'muted', text: monthLabel(ym) + ', ' + (daysInMonth(ym) - parseInt(t.slice(8), 10)) + ' days left' })),
    mv.map((x, i) => lbRow(i, x.p, fmt(toDisp(x.volume)) + ' ' + unit(), x.days + ' sessions', x.volume / mtop))
  ));

  const mine = state.challenges.slice().sort((a, b) => (a.end_date < b.end_date ? 1 : -1));
  mine.forEach((c) => {
    const k = key(c.exercise);
    const board = state.profiles.map((p) => ({ p, b: bestE1(p.id, k, c.start_date, c.end_date) }))
      .filter((x) => x.b).sort((a, b) => b.b.e - a.b.e);
    const status = t < c.start_date ? 'starts ' + shortDate(c.start_date) : t > c.end_date ? 'ended ' + shortDate(c.end_date) : daysBetween(t, c.end_date) + ' days left';
    const top = board.length ? board[0].b.e : 1;
    const box = h('div', { class: 'chal' },
      h('div', { class: 'chalhead' },
